# CI — the repo's first pull_request-triggered checks (2026-07-10 CI
# evidence audit: no PR event ran anything, "green main" meant no workflow
# ran, and the C# server was compiled by NOTHING except Render's invisible
# post-merge build). Two jobs, both mandatory-by-presence on every PR and
# every push to main:
#   frontend — a REAL typecheck: `tsc -b --force` against the project
#     references (bare `tsc --noEmit` on the solution-style root tsconfig
#     is a no-op — the recorded PR #25 lesson), then the production
#     bundle build.
#   server — `dotnet build`: a C# compile error can no longer merge green.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --force: full check, immune to any restored incremental build state
      - run: npx tsc -b --force
      - run: npx vite build
      # The reception screen's submit gate is the ONLY place design §3.2's five
      # required admission fields are enforced anywhere in the product — the
      # server accepts each of them as optional, on the owner's ruling (c),
      # because required columns would make admission impossible on the next
      # update of a live install while /healthz kept answering 200 (so the
      # updater would not roll back). Reception.tsx explains that above the
      # gate; a comment can be read past, which is why this also runs. Its
      # teeth are measured, not asserted: removing any ONE of the five from
      # `formOk` fails it, naming the field — verified by deleting each of the
      # five in turn before it was committed.
      - name: Reception still enforces design §3.2's required admission fields
        run: node scripts/reception-required-fields-gate.mjs
      # Ward A2 — the awaiting-bed screen's structural wiring: the action is
      # ASSIGNMENT (never transferEncounter — the §3.1 partition, which the
      # server enforces with a 409 the client must not invite), the list
      # reads the A1 `bedless=true` filter (never a client-side
      # recomputation), the route costs beds.assign, and the shared BedChip
      # + print layout keep their explicit bedless renderings (ward.md A5).
      # SOURCE check like the gate above it — presence and wiring, not
      # firing; its teeth were measured before commit by breaking each
      # pinned fact in turn (the gate's header records how).
      - name: Awaiting-bed stays wired to assignment, bedless=true, beds.assign (Ward A2)
        run: node scripts/awaiting-bed-gate.mjs
      # PR-2 (environment separation): VITE_APP_ENV is allow-listed at the ONE
      # chokepoint every build entry point passes through — vite.config.ts —
      # mirroring the server's AppEnv.Known (the source of truth). Three legs,
      # none vacuous: (1) the two allow-lists must be EQUAL at source level, and
      # the check dies if either anchor stops matching (a regex that silently
      # finds nothing would certify drift); (2) the refusal is EXECUTED — an
      # unknown value must fail the REAL build with the gate's own message, so a
      # build that fails for any other reason fails the grep, and a gate that
      # stopped firing fails the exit-code check; (3) the production identity
      # must still build (unset/dev is already proven by the plain
      # `npx vite build` step above; staging by the deploy/package pipelines).
      - name: VITE_APP_ENV allow-list gate has teeth (environment-separation PR-2)
        run: |
          python3 - <<'PY'
          import re, sys
          vite = open('vite.config.ts').read()
          cs = open('server/Core/Shared/AppEnv.cs').read()
          vm = re.search(r"KNOWN_APP_ENVS = \[([^\]]*)\]", vite)
          cm = re.search(r"Known = \[([^\]]*)\]", cs)
          if not vm or not cm:
              sys.exit("mirror check could not FIND a list — an anchor drifted; fix the gate, never the grep")
          norm = lambda m: sorted(t.strip().strip('\'"') for t in m.group(1).split(',') if t.strip())
          if norm(vm) != norm(cm):
              sys.exit(f"allow-list DRIFT: vite {norm(vm)} != server AppEnv.Known {norm(cm)}")
          print("ok: vite allow-list mirrors AppEnv.Known:", " | ".join(norm(vm)))
          PY
          set +e
          out=$(VITE_APP_ENV=definitely-invalid npx vite build 2>&1); rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "GATE DID NOT FIRE: an unknown VITE_APP_ENV built successfully"; exit 1
          fi
          echo "$out" | grep -q "UNKNOWN ENVIRONMENT IDENTITY: VITE_APP_ENV is 'definitely-invalid'" \
            || { echo "the build failed but NOT by the gate's own message:"; echo "$out" | tail -5; exit 1; }
          echo "ok: unknown VITE_APP_ENV refused by the gate's own message"
          VITE_APP_ENV=production npx vite build --base=/ > /dev/null
          echo "ok: production identity still builds"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build server --nologo
      # A vocabulary tenant registered without its own row factory used to
      # write a ShiftRow instead — wrong table, HTTP 200, no exception, no
      # failing test. The mapper now takes the factory as a REQUIRED
      # parameter, so the compiler catches an omission; this gate catches the
      # default arm ever coming back, here or anywhere else in server/.
      # Its teeth are measured, not asserted: it was written before the fix and
      # failed on the real line (VocabApi.cs:183), and re-inserting that arm as
      # code fails it again while the comment that quotes it does not.
      - name: No tenant-create path may fall back to a concrete table
        run: node scripts/vocab-registration-gate.mjs

  # production-seed — the install guarantee, protected on every change: a
  # PRODUCTION boot must seed catalogues + configuration + ONE bootstrap
  # admin and ZERO patients / ZERO demo credentials, and the boot tripwires
  # must refuse the demo credential (T1) and a missing install decision (T2).
  # This is what keeps a hospital install from ever inheriting demo patients
  # or the shared demo password — asserted, not assumed.
  production-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aurora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DLL: server/bin/Debug/net8.0/AuroraIcu.Api.dll
      JWT_SECRET: ci-production-seed-guard-secret-0123456789abcdef
      CORS_ORIGINS: https://hospital.aurora.example
      ASPNETCORE_URLS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build server --nologo

      - name: A production boot seeds catalogues + bootstrap admin, ZERO patients / demo creds
        run: |
          export APP_ENV=production
          export DATABASE_URL="postgres://aurora:ci@localhost:5432/aurora"
          export FORMULARY_SEED=starter
          export ADMIN_BOOTSTRAP_PASSWORD='CI-Bootstrap-Xk-2026'
          dotnet "$DLL" > boot.log 2>&1 &
          SRV=$!
          up=""; for i in $(seq 1 90); do
            if curl -sf -m2 http://localhost:8080/healthz >/dev/null; then up=1; break; fi
            kill -0 $SRV 2>/dev/null || { echo "server exited during boot"; cat boot.log; exit 1; }
            sleep 2
          done
          [ -n "$up" ] || { echo "no healthz after 180s"; tail -30 boot.log; exit 1; }
          curl -s http://localhost:8080/healthz | grep -q '"environment":"production"' \
            || { echo "healthz did not report environment=production"; curl -s http://localhost:8080/healthz; exit 1; }
          # THE POSTGRES CLIENT COMES FROM THE SERVICE CONTAINER, NOT FROM apt.
          # This job used to `apt-get install postgresql-client` on every run —
          # a network fetch in the middle of CI — and it STALLED TWICE in one
          # evening (2026-08-18), wedging the job for 20+ minutes each time
          # against a ~2 minute normal runtime, on a commit whose content had
          # already passed. The client was always right there: the
          # `postgres:16-alpine` service container ships psql. Using it removes
          # the fetch, and the whole class of failure goes with it.
          # Resolve the service container by IMAGE, then by any postgres image
          # as a fallback — the runner names service containers itself, so the
          # image is the stable handle. FAILS LOUDLY if neither matches: an
          # unresolvable client must stop the job, never let the assertions
          # below skip quietly (a green run with them skipped is worse than
          # the stall this change removes).
          PG=$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -1)
          [ -n "$PG" ] || PG=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')
          [ -n "$PG" ] || { echo "FAIL: no postgres service container found — psql is unreachable"; docker ps; exit 1; }
          echo "  psql via service container $PG ($(docker exec "$PG" psql --version))"
          # -w on every call: psql must FAIL rather than wait on a hidden stdin
          # (the field failure the installer gate at the bottom of this file
          # exists for — the same discipline, applied here by choice).
          PSQL() { docker exec -e PGPASSWORD=ci "$PG" psql -w -U aurora -d aurora -tAc "$1"; }
          fail=0
          check0() { local n; n=$(PSQL "select count(*) from \"$1\""); [ "$n" = "0" ] && echo "  ok  $1=0" || { echo "  FAIL $1=$n (expected 0)"; fail=1; }; }
          checkpos() { local n; n=$(PSQL "select count(*) from \"$1\""); [ "$n" -gt 0 ] 2>/dev/null && echo "  ok  $1=$n" || { echo "  FAIL $1=$n (expected > 0)"; fail=1; }; }
          echo "clinical tables must be EMPTY:"
          for t in AdtPatients Encounters Orders Observations LabDraws Handoffs Patients; do check0 "$t"; done
          # The Inpatient Reception master data seeds NOTHING in production, on
          # purpose: admission types, departments, services and admission
          # sources are 100% hospital-specific, so there is no honest starting
          # set (the hospital-identity precedent, NOT the dispositions /
          # isolation / shifts one — those are clinically universal and seed in
          # both modes, and are asserted PRESENT on the line below).
          # Asserted here rather than merely done: an absence with no assertion
          # behind it is indistinguishable from a seed somebody forgot.
          echo "reception master data must be EMPTY on a production boot:"
          for t in AdmissionTypes Departments Services AdmissionSources; do check0 "$t"; done
          echo "catalogues/config must be PRESENT:"
          for t in Beds LabTests OrderSets CodeStatuses Dispositions IsolationTypes Shifts NamedFrequencies InteractionRules ImagingCatalog ObservationTypes; do checkpos "$t"; done
          echo "users must be exactly admin + system:"
          USERS=$(PSQL "select string_agg(\"Username\",',' order by \"Username\") from \"Users\"")
          [ "$USERS" = "admin,system" ] && echo "  ok  users=[$USERS]" || { echo "  FAIL users=[$USERS] (expected admin,system)"; fail=1; }
          # The §3.2 admission fields must exist on Encounters and must ALL be
          # NULLABLE. The nullability is the assertion that matters, not the
          # presence: a NOT NULL column here would need a default, and a
          # default would write a fabricated department onto every historical
          # encounter (§5, never fabricate). It would also make admission
          # impossible on a live install until somebody configured a
          # department — while /healthz still answered 200, so the updater
          # would NOT roll back. This line is what stops that reaching a site.
          echo "reception admission fields must exist on Encounters and be NULLABLE:"
          for c in AdmissionTypeCode DepartmentCode ServiceCode AdmissionSourceCode \
                   AdmittingDoctorUserId ReferrerUserId ReferrerName; do
            NUL=$(PSQL "select is_nullable from information_schema.columns where table_name='Encounters' and column_name='$c'")
            [ "$NUL" = "YES" ] && echo "  ok  Encounters.$c nullable" \
              || { echo "  FAIL Encounters.$c is_nullable=[$NUL] (expected YES; empty = column missing)"; fail=1; }
          done
          # …and no reception admission field carries a DEFAULT, for the same
          # reason: a default is how a fabricated value gets in without anyone
          # writing one.
          DEFS=$(PSQL "select count(*) from information_schema.columns where table_name='Encounters' and column_default is not null and column_name in ('AdmissionTypeCode','DepartmentCode','ServiceCode','AdmissionSourceCode','AdmittingDoctorUserId','ReferrerUserId','ReferrerName')")
          [ "$DEFS" = "0" ] && echo "  ok  no column defaults on the reception fields" \
            || { echo "  FAIL $DEFS reception column(s) carry a default"; fail=1; }
          echo "hospital identity must be UNSET (no demo hospital on a real install):"
          check0 HospitalIdentity
          echo "formulary must be seeded but ALL DEACTIVATED:"
          ACT=$(PSQL "select count(*) from \"FormularyDrugs\" where \"Active\"=true")
          INACT=$(PSQL "select count(*) from \"FormularyDrugs\" where \"Active\"=false")
          { [ "$ACT" = "0" ] && [ "$INACT" -gt 0 ]; } && echo "  ok  formulary active=0 inactive=$INACT" || { echo "  FAIL formulary active=$ACT inactive=$INACT"; fail=1; }
          echo "NO active account may verify against the demo password (T1 scan clean at boot):"
          grep -q "T1 demo-credential scan: clean" boot.log && echo "  ok  T1 scan clean" || { echo "  FAIL T1 scan line missing"; fail=1; }
          kill $SRV 2>/dev/null || true
          [ "$fail" = 0 ] || exit 1

      - name: T1 refuses the shared demo password as the bootstrap credential
        run: |
          # THE POSTGRES CLIENT COMES FROM THE SERVICE CONTAINER, NOT FROM apt.
          # This job used to `apt-get install postgresql-client` on every run —
          # a network fetch in the middle of CI — and it STALLED TWICE in one
          # evening (2026-08-18), wedging the job for 20+ minutes each time
          # against a ~2 minute normal runtime, on a commit whose content had
          # already passed. The client was always right there: the
          # `postgres:16-alpine` service container ships psql. Using it removes
          # the fetch, and the whole class of failure goes with it.
          # Resolve the service container by IMAGE, then by any postgres image
          # as a fallback — the runner names service containers itself, so the
          # image is the stable handle. FAILS LOUDLY if neither matches: an
          # unresolvable client must stop the job, never let the assertions
          # below skip quietly (a green run with them skipped is worse than
          # the stall this change removes).
          PG=$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -1)
          [ -n "$PG" ] || PG=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')
          [ -n "$PG" ] || { echo "FAIL: no postgres service container found — psql is unreachable"; docker ps; exit 1; }
          echo "  psql via service container $PG ($(docker exec "$PG" psql --version))"
          # -w on every call: psql must FAIL rather than wait on a hidden stdin
          # (the field failure the installer gate at the bottom of this file
          # exists for — the same discipline, applied here by choice).
          docker exec -e PGPASSWORD=ci "$PG" createdb -w -U aurora aurora_t1
          set +e
          APP_ENV=production DATABASE_URL="postgres://aurora:ci@localhost:5432/aurora_t1" \
            FORMULARY_SEED=starter ADMIN_BOOTSTRAP_PASSWORD='Aurora2026!' \
            timeout 90 dotnet "$DLL" > t1.log 2>&1
          rc=$?
          set -e
          echo "exit=$rc"
          grep -q "T1 — DEMO CREDENTIAL IN PRODUCTION" t1.log && [ "$rc" != 0 ] \
            && echo "  ok  refused (T1)" || { echo "  FAIL — did not refuse the demo bootstrap password"; tail -20 t1.log; exit 1; }

      - name: T2 refuses a missing install decision (FORMULARY_SEED)
        run: |
          set +e
          APP_ENV=production DATABASE_URL="postgres://aurora:ci@localhost:5432/aurora" \
            ADMIN_BOOTSTRAP_PASSWORD='CI-Bootstrap-Xk-2026' \
            timeout 60 dotnet "$DLL" > t2.log 2>&1
          rc=$?
          set -e
          echo "exit=$rc"
          grep -q "T2 — MISSING INSTALL DECISION" t2.log && [ "$rc" != 0 ] \
            && echo "  ok  refused (T2)" || { echo "  FAIL — did not refuse the missing FORMULARY_SEED"; tail -20 t2.log; exit 1; }

      # ---- THE MAPPER WRITES TO THE TENANT'S OWN TABLE (runtime proof) ----
      #
      # #195 and #197 made a wrong-table vocabulary write a COMPILE error, and
      # the deliberate wrong-DbSet commit on #197 proved the compiler answers.
      # Neither proves the mapper, when it compiles, actually routes each POST
      # to the DbSet its caller supplied. That is a RUNTIME fact and nothing
      # asserted it: the vocabulary MANAGEMENT endpoints have no E2E coverage
      # at all (only the disposition CONSUMPTION path is exercised, in
      # deployed-adt-e2e.yml). This leg is that assertion.
      #
      # isolation-types and shifts, deliberately: IsolationTypeRow and ShiftRow
      # are field-for-field identical (Code/Label/Seq/Active/EventsJson), which
      # is exactly the confusion the retired `_ => db.Shifts.Add(...)` default
      # lived in. DispositionRow carries IsDeath, so it would be a weaker probe.
      #
      # LAST STEP, deliberately. The clean-slate step above asserts the user set
      # is EXACTLY admin,system; minting the Consultant this leg needs any
      # earlier would turn that assertion red for an unrelated reason. Step 1
      # also kills its server, so this one boots its own against the database
      # step 1 already seeded.
      #
      # PRODUCTION-SEED ONLY. This job gets a fresh Postgres service container
      # per run, so these writes die with the job. It must NEVER move into a
      # deployed suite: vocabulary entries are deactivate-never-delete, so every
      # dispatch would leave two permanent rows in the durable staging record.
      - name: The vocabulary mapper writes to the tenant's OWN table (runtime, on the seeded DB)
        run: |
          export APP_ENV=production
          export DATABASE_URL="postgres://aurora:ci@localhost:5432/aurora"
          export FORMULARY_SEED=starter
          export ADMIN_BOOTSTRAP_PASSWORD='CI-Bootstrap-Xk-2026'
          API=http://localhost:8080
          die() { echo "  FAIL $*"; exit 1; }
          # step 1 killed its server; boot our own against the SAME, already-seeded database
          dotnet "$DLL" > vocab.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          up=""; for i in $(seq 1 90); do
            if curl -sf -m2 "$API/healthz" >/dev/null; then up=1; break; fi
            kill -0 $SRV 2>/dev/null || { echo "server exited during boot"; cat vocab.log; exit 1; }
            sleep 2
          done
          [ -n "$up" ] || { echo "no healthz after 180s"; tail -30 vocab.log; exit 1; }

          # THE POSTGRES CLIENT COMES FROM THE SERVICE CONTAINER, NOT FROM apt.
          # This job used to `apt-get install postgresql-client` on every run —
          # a network fetch in the middle of CI — and it STALLED TWICE in one
          # evening (2026-08-18), wedging the job for 20+ minutes each time
          # against a ~2 minute normal runtime, on a commit whose content had
          # already passed. The client was always right there: the
          # `postgres:16-alpine` service container ships psql. Using it removes
          # the fetch, and the whole class of failure goes with it.
          # Resolve the service container by IMAGE, then by any postgres image
          # as a fallback — the runner names service containers itself, so the
          # image is the stable handle. FAILS LOUDLY if neither matches: an
          # unresolvable client must stop the job, never let the assertions
          # below skip quietly (a green run with them skipped is worse than
          # the stall this change removes).
          PG=$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -1)
          [ -n "$PG" ] || PG=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/postgres/{print $1; exit}')
          [ -n "$PG" ] || { echo "FAIL: no postgres service container found — psql is unreachable"; docker ps; exit 1; }
          echo "  psql via service container $PG ($(docker exec "$PG" psql --version))"
          # -w on every call: psql must FAIL rather than wait on a hidden stdin
          # (the field failure the installer gate at the bottom of this file
          # exists for — the same discipline, applied here by choice).
          PSQL() { docker exec -e PGPASSWORD=ci "$PG" psql -w -U aurora -d aurora -tAc "$1"; }
          # "<count>|<comma-joined codes>" — the code set is ordered BY POSTGRES, and every
          # later comparison re-reads it the same way, so no client-side sort can disagree
          # with the database's collation.
          snap() { echo "$(PSQL "select count(*) from \"$1\"")|$(PSQL "select coalesce(string_agg(\"Code\", ',' order by \"Code\"), '') from \"$1\"")"; }
          assert_unchanged() { # table, its BEFORE snapshot
            now=$(snap "$1")
            # SELF-GUARDING: this compares a read to ANOTHER READ, so two empty
            # results would satisfy it. The BEFORE snapshots are already proven
            # non-empty above, which makes that unreachable today — but a check
            # that is only safe because of a guard somewhere else is one edit
            # away from passing for free. It states its own precondition.
            [ -n "$now" ] || die "$1 read back EMPTY — psql is not answering; an unchanged/unchanged comparison here would pass vacuously"
            [ "$now" = "$2" ] || die "$1 CHANGED: before [$2] now [$now]"
            echo "  ok   $1 unchanged [$now]"
          }
          assert_added() { # table, its BEFORE snapshot, the one code this POST must have added
            bn=${2%%|*}; bc=${2#*|}
            n=$(PSQL "select count(*) from \"$1\"")
            hits=$(PSQL "select count(*) from \"$1\" where \"Code\" = '$3'")
            others=$(PSQL "select coalesce(string_agg(\"Code\", ',' order by \"Code\"), '') from \"$1\" where \"Code\" <> '$3'")
            [ "$n" = "$((bn + 1))" ] || die "$1 count is $n, expected $((bn + 1))"
            [ "$hits" = "1" ] || die "$1 does not carry '$3' (found $hits)"
            [ "$others" = "$bc" ] || die "$1's OTHER codes moved: before [$bc] now [$others]"
            echo "  ok   $1 = before($bn) + exactly '$3'"
          }
          absent() { # table, code that must NOT be in it
            hits=$(PSQL "select count(*) from \"$1\" where \"Code\" = '$2'")
            [ "$hits" = "0" ] || die "'$2' landed in $1 — the wrong table"
            echo "  ok   '$2' is absent from $1"
          }

          # BEFORE — never a hardcoded seed count; and a snapshot of nothing would make
          # every "unchanged" assertion below pass vacuously, so refuse an empty one.
          BEFORE_Dispositions=$(snap Dispositions)
          BEFORE_IsolationTypes=$(snap IsolationTypes)
          BEFORE_Shifts=$(snap Shifts)
          for t in Dispositions IsolationTypes Shifts; do
            eval "b=\$BEFORE_$t"
            [ "${b%%|*}" -gt 0 ] 2>/dev/null || die "BEFORE snapshot of $t is [$b] — the scan is not reading the database"
            echo "  before $t = [$b]"
          done

          # ---- the auth path, four steps, none of them assumable ----
          # 1. the bootstrap admin ships MustChangePassword, so login returns ONLY a
          #    pw-change STEP token (audience <env>#pw-change) — never a session.
          resp=$(curl -sf -X POST "$API/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CI-Bootstrap-Xk-2026"}')
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("mustChangePassword") is True and "token" not in d, d; print("  ok   bootstrap login -> change token only, no session")'
          CT=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["changeToken"])')
          rc=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CT" "$API/api/icu/users")
          [ "$rc" = "401" ] || die "the pw-change step token authenticated an API endpoint (HTTP $rc, expected 401)"
          echo "  ok   step token is structurally invalid on the API (401)"
          # 2. change-password ends in Proceed(), and a single-role account skips the
          #    chooser — so the SESSION comes back from this one call.
          ADM=$(curl -sf -X POST "$API/api/auth/change-password" -H 'Content-Type: application/json' \
            -d "{\"token\":\"$CT\",\"newPassword\":\"CI-Vocab-Adm-9x\"}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["jobTitle"]=="System Administrator" and d["roles"]==["System Administrator"], d; print(d["token"])')
          [ -n "$ADM" ] || die "no session token from change-password"
          echo "  ok   change-password returned the session directly (one call, no chooser)"

          # THE ADMIN-403 LEG. Without it a green run cannot tell "the Consultant's atom
          # made this work" from "it would have worked anyway": the System Administrator
          # holds users.manage/users.view/backup.manage and NO vocabulary atom.
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ADM" -H 'Content-Type: application/json' \
            -d '{"label":"the system administrator must not be able to add a shift"}' "$API/api/icu/shifts")
          [ "$rc" = "403" ] || die "bootstrap admin POST /api/icu/shifts -> HTTP $rc, expected 403"
          echo "  ok   bootstrap admin POST /api/icu/shifts -> 403 (holds no vocabulary atom)"

          # 3. a clinical JobTitle needs an explicit justification
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $ADM" -H 'Content-Type: application/json' \
            -d '{"username":"ci.vocab.doc","name":"CI Vocab Consultant","roles":["Consultant"],"initialPassword":"CI-Vocab-Doc-9xTmp"}' \
            "$API/api/icu/users")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "Consultant create without justification -> HTTP $(echo "$out" | tail -1), expected 400"
          echo "$out" | head -1 | grep -q "requires a justification" || die "the 400 did not name the missing justification: $(echo "$out" | head -1)"
          echo "  ok   Consultant create without justification -> 400 naming it"
          curl -sf -X POST -H "Authorization: Bearer $ADM" -H 'Content-Type: application/json' \
            -d '{"username":"ci.vocab.doc","name":"CI Vocab Consultant","roles":["Consultant"],"initialPassword":"CI-Vocab-Doc-9xTmp","justification":"production-seed CI — vocabulary mapper table-routing proof"}' \
            "$API/api/icu/users" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["roles"]==["Consultant"] and d["mustChangePassword"] is True, d; print("  ok   Consultant created (justified), first-login change forced")'
          # 4. the created account carries the same forced change
          resp=$(curl -sf -X POST "$API/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"ci.vocab.doc","password":"CI-Vocab-Doc-9xTmp"}')
          echo "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("mustChangePassword") is True and "token" not in d, d'
          CT2=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["changeToken"])')
          DOC=$(curl -sf -X POST "$API/api/auth/change-password" -H 'Content-Type: application/json' \
            -d "{\"token\":\"$CT2\",\"newPassword\":\"CI-Vocab-Doc-9x\"}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["jobTitle"]=="Consultant", d; print(d["token"])')
          [ -n "$DOC" ] || die "no session token for the Consultant"
          echo "  ok   Consultant session (SeniorDoctor -> isolation.manage + shifts.manage)"

          ISO="iso-ci-$GITHUB_RUN_ID"; SHF="shf-ci-$GITHUB_RUN_ID"

          # ---- the write that the retired `_ => db.Shifts.Add(...)` default got wrong ----
          echo "POST /api/icu/isolation-types:"
          curl -sf -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$ISO\",\"label\":\"CI isolation probe $GITHUB_RUN_ID\"}" "$API/api/icu/isolation-types" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['code']=='$ISO' and d['active'] is True, d; assert 'isDeath' not in d, d; print('  ok   IsolationTypeDto returned for '+d['code'])"
          assert_added IsolationTypes "$BEFORE_IsolationTypes" "$ISO"
          # EVERY SIBLING TABLE IS UNCHANGED. This is the assertion the whole leg exists
          # for: IsolationTypeRow and ShiftRow are field-for-field identical, so a mapper
          # that routed by anything other than the caller's own DbSet would have written
          # the shift table here and returned exactly the same 200.
          for t in Shifts Dispositions; do
            eval "b=\$BEFORE_$t"
            assert_unchanged "$t" "$b"
          done
          absent Shifts "$ISO"
          absent Dispositions "$ISO"

          echo "POST /api/icu/shifts:"
          curl -sf -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$SHF\",\"label\":\"CI shift probe $GITHUB_RUN_ID\"}" "$API/api/icu/shifts" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['code']=='$SHF' and d['active'] is True, d; assert 'isDeath' not in d, d; print('  ok   ShiftDto returned for '+d['code'])"
          assert_added Shifts "$BEFORE_Shifts" "$SHF"
          assert_unchanged Dispositions "$BEFORE_Dispositions"
          absent IsolationTypes "$SHF"
          absent Dispositions "$SHF"
          # and the isolation row is still exactly where it landed — the shifts write
          # moved nothing of its neighbour's
          assert_added IsolationTypes "$BEFORE_IsolationTypes" "$ISO"
          echo "both vocabularies wrote to their OWN table; every sibling is byte-identical to its pre-POST code set"

          # ---- SERVICE: the one insert the type system CANNOT reach --------
          # Everything above proves the MAPPER routes correctly, and #197 makes
          # a mapper registration naming the wrong DbSet a compile error. The
          # services POST is different in kind: it carries an immutable parent
          # at creation, so it maps its own POST and its `db.Services.Add(row)`
          # is HAND-WRITTEN. Writing db.Shifts.Add(...) there would compile
          # perfectly. That escape hatch is the only surviving route to the
          # wrong-table class, so it gets the runtime assertion the compiler
          # cannot give it.
          #
          # Reception master data is hospital.configure — the OFFICE
          # Administrator's atom. The Consultant above does not hold it and
          # neither does the bootstrap System Administrator, so this leg mints
          # its own office-Administrator account (a Hospital Administrator
          # title needs no justification: the profile is neither clinical nor
          # SysAdmin).
          echo "SERVICE (bespoke POST, outside the compile-time guarantee):"
          for t in AdmissionTypes Departments Services AdmissionSources; do
            n=$(PSQL "select count(*) from \"$t\"")
            [ "$n" = "0" ] || die "$t should be EMPTY before this leg (production seeds none), found $n"
          done
          echo "  ok   all four reception tables start empty"
          curl -sf -X POST -H "Authorization: Bearer $ADM" -H 'Content-Type: application/json' \
            -d '{"username":"ci.vocab.adm","name":"CI Vocab Office Admin","roles":["Hospital Administrator"],"initialPassword":"CI-Vocab-Off-9xTmp"}' \
            "$API/api/icu/users" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["roles"]==["Hospital Administrator"], d; print("  ok   office Administrator created (no justification needed — neither clinical nor SysAdmin)")'
          resp=$(curl -sf -X POST "$API/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"ci.vocab.adm","password":"CI-Vocab-Off-9xTmp"}')
          CT3=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["changeToken"])')
          OFF=$(curl -sf -X POST "$API/api/auth/change-password" -H 'Content-Type: application/json' \
            -d "{\"token\":\"$CT3\",\"newPassword\":\"CI-Vocab-Off-9x\"}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["jobTitle"]=="Hospital Administrator", d; print(d["token"])')
          [ -n "$OFF" ] || die "no session token for the office Administrator"

          # NEGATIVE CONTROLS, both directions. Without these a green run cannot
          # tell "hospital.configure gated this" from "anyone could have".
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' \
            -d '{"label":"a consultant must not configure departments"}' "$API/api/icu/departments")
          [ "$rc" = "403" ] || die "Consultant POST /api/icu/departments -> HTTP $rc, expected 403"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ADM" -H 'Content-Type: application/json' \
            -d '{"label":"a system administrator must not configure departments"}' "$API/api/icu/departments")
          [ "$rc" = "403" ] || die "bootstrap SysAdmin POST /api/icu/departments -> HTTP $rc, expected 403"
          echo "  ok   Consultant AND System Administrator are both 403 on /departments (hospital.configure is the office atom)"

          DEP="dep-ci-$GITHUB_RUN_ID"; SVC="svc-ci-$GITHUB_RUN_ID"
          curl -sf -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$DEP\",\"label\":\"CI department probe $GITHUB_RUN_ID\"}" "$API/api/icu/departments" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['code']=='$DEP' and d['active'] is True, d; print('  ok   DepartmentDto returned for '+d['code'])"

          # unknown parent -> 400 that NAMES what is valid (the GroupCode
          # precedent); a service may not exist without a real department
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"code\":\"svc-orphan-$GITHUB_RUN_ID\",\"label\":\"orphan $GITHUB_RUN_ID\",\"departmentCode\":\"no-such-dept\"}" "$API/api/icu/services")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "service with unknown departmentCode -> HTTP $(echo "$out" | tail -1), expected 400"
          echo "$out" | head -1 | grep -q "$DEP" || die "the 400 did not name the valid departments: $(echo "$out" | head -1)"
          echo "  ok   unknown departmentCode -> 400 naming the active departments"
          [ "$(PSQL "select count(*) from \"Services\"")" = "0" ] || die "the refused service was written anyway"

          curl -sf -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$SVC\",\"label\":\"CI service probe $GITHUB_RUN_ID\",\"departmentCode\":\"$DEP\"}" "$API/api/icu/services" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['code']=='$SVC' and d['departmentCode']=='$DEP' and d['active'] is True, d; print('  ok   ServiceDto returned for '+d['code']+' under '+d['departmentCode'])"

          # THE ASSERTION THIS LEG EXISTS FOR — by SQL, not by the response the
          # same hand-written code produced.
          landed=$(PSQL "select count(*) from \"Services\" where \"Code\" = '$SVC' and \"DepartmentCode\" = '$DEP'")
          [ "$landed" = "1" ] || die "'$SVC' is NOT in Services with parent '$DEP' (found $landed)"
          [ "$(PSQL "select count(*) from \"Services\"")" = "1" ] || die "Services holds more than the one row this leg created"
          echo "  ok   Services = exactly '$SVC', parent '$DEP'"
          # every table the hand-written Add could have named instead
          for t in AdmissionTypes AdmissionSources; do
            n=$(PSQL "select count(*) from \"$t\"")
            [ "$n" = "0" ] || die "the services insert wrote $n row(s) into $t — the wrong table"
          done
          absent Shifts "$SVC"; absent IsolationTypes "$SVC"; absent Dispositions "$SVC"
          assert_added Shifts "$BEFORE_Shifts" "$SHF"
          assert_added IsolationTypes "$BEFORE_IsolationTypes" "$ISO"
          assert_unchanged Dispositions "$BEFORE_Dispositions"
          [ "$(PSQL "select count(*) from \"Departments\"")" = "1" ] || die "Departments moved"
          echo "  ok   the hand-written insert touched Services and nothing else"

          # NO REPARENTING — the edit contract has no departmentCode member, so
          # Disallow turns naming it into a binding 400. Asserted, not assumed.
          out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"label\":\"CI service probe $GITHUB_RUN_ID renamed\",\"departmentCode\":\"$DEP\"}" "$API/api/icu/services/$SVC")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "PUT naming departmentCode -> HTTP $(echo "$out" | tail -1), expected a binding 400"
          [ "$(PSQL "select \"DepartmentCode\" from \"Services\" where \"Code\" = '$SVC'")" = "$DEP" ] || die "the parent moved"
          echo "  ok   a PUT naming departmentCode is a binding 400 — no reparenting path exists"

          # THE HIERARCHY GUARD (the half that can be built): a department with
          # an active service refuses to retire.
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/departments/$DEP/deactivate")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "retiring a department with an active service -> HTTP $(echo "$out" | tail -1), expected 409"
          echo "$out" | head -1 | grep -q "active service" || die "the 409 did not name the blocking services: $(echo "$out" | head -1)"
          [ "$(PSQL "select \"Active\" from \"Departments\" where \"Code\" = '$DEP'")" = "t" ] || die "the department was retired despite the guard"
          echo "  ok   department with an active service refuses to retire (409, department still active)"
          echo "the bespoke services insert is covered by SQL — the one path #197's compiler guarantee cannot reach"

          # ---- THE LABEL SNAPSHOT, and the rename it exists to survive ------
          # Ruling 3 requires the admission event to snapshot the LABEL, so a
          # later rename cannot reinterpret a record already written. The
          # assertion that proves it is not "a snapshot exists" — it is that
          # the snapshot DOES NOT MOVE when the vocabulary underneath it does.
          # This runs HERE, on the ephemeral production database, because the
          # test renames a department: doing that against the shared staging
          # service would leave real vocabulary edited if the run died midway.
          # The office Administrator minted above holds admissions.create
          # (reception's atom) and NOT adt.admit, so it admits without a bed —
          # which is also the reception path end to end.
          echo "LABEL SNAPSHOT (ruling 3):"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"nameFirst\":\"Snap\",\"nameSecond\":\"Shot\",\"nameFamily\":\"Case\",\"sex\":\"M\",\"allergies\":\"None\",\"dateOfBirth\":\"1980-01-01\",\"diagnosis\":\"CI snapshot probe\",\"attending\":\"CI Probe\",\"departmentCode\":\"$DEP\",\"serviceCode\":\"$SVC\"}" \
            "$API/api/icu/adt/admissions")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "reception-style admission -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          ENCID=$(echo "$out" | head -1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["encounter"]["encounterId"])')
          echo "  ok   admitted $ENCID with no bed (admissions.create, no adt.admit)"
          SNAP_BEFORE=$(PSQL "select \"EventsJson\"::json->0->'coding' from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          echo "$SNAP_BEFORE" | grep -q "CI department probe $GITHUB_RUN_ID" \
            || die "the admitted event carries no department label snapshot: $SNAP_BEFORE"
          echo "  ok   the admitted event snapshotted the labels: $SNAP_BEFORE"
          # rename the department underneath the record
          curl -sf -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"label\":\"RENAMED after the admission $GITHUB_RUN_ID\"}" "$API/api/icu/departments/$DEP" >/dev/null \
            || die "the rename was refused — the test cannot prove anything"
          [ "$(PSQL "select \"Label\" from \"Departments\" where \"Code\" = '$DEP'")" = "RENAMED after the admission $GITHUB_RUN_ID" ] \
            || die "the live vocabulary did NOT change — the rename is not exercising anything"
          echo "  ok   the LIVE vocabulary now reads the new name"
          SNAP_AFTER=$(PSQL "select \"EventsJson\"::json->0->'coding' from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          # Same shape, same hazard: BEFORE == AFTER is satisfied by two empty
          # strings. The grep above already proves BEFORE is non-empty; this
          # says so for AFTER too, so the assertion does not depend on a
          # neighbouring line to have teeth.
          [ -n "$SNAP_AFTER" ] || die "the snapshot read back EMPTY after the rename — psql is not answering, and BEFORE==AFTER would pass vacuously"
          [ "$SNAP_BEFORE" = "$SNAP_AFTER" ] \
            || die "THE SNAPSHOT MOVED WITH THE RENAME — history was rewritten: [$SNAP_AFTER]"
          echo "$SNAP_AFTER" | grep -q "RENAMED after the admission" \
            && die "the snapshot absorbed the new name — it is resolving live, not snapshotting"
          echo "  ok   the snapshot is UNMOVED — the record still reads what it read when it was written"

          # ---- the date filter: every status, bounded by the day ------------
          TODAY=$(date -u +%F)
          curl -sf -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?admittedOn=$TODAY" -o /tmp/admitted-today.json \
            || die "admittedOn query failed"
          ENCID="$ENCID" python3 -c '
          import json, os
          rows = json.load(open("/tmp/admitted-today.json"))
          assert any(r["encounterId"] == os.environ["ENCID"] for r in rows), (os.environ["ENCID"], [r["encounterId"] for r in rows])
          print(f"  ok   admittedOn lists {len(rows)} encounter(s) including this one")'
          rc=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?admittedOn=18-08-2026")
          [ "$rc" = "400" ] || die "a malformed admittedOn -> HTTP $rc, expected 400"
          echo "  ok   malformed admittedOn -> 400 (four-code discipline holds)"
          # the \d class fix's SECOND live hole: an Arabic-Indic-digit date
          # passed ^\d{4}-\d{2}-\d{2}$ and then prefix-matched nothing —
          # a silent empty 200 where the malformed-date 400 was meant to fire
          # ٢٠٢٦-٠٨-١٩, percent-encoded so the assertion does not depend on
          # the runner shell's byte handling
          out=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $OFF" \
            "$API/api/icu/adt/encounters?admittedOn=%D9%A2%D9%A0%D9%A2%D9%A6-%D9%A0%D9%A8-%D9%A1%D9%A9")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "an Arabic-Indic-digit admittedOn -> HTTP $(echo "$out" | tail -1), expected 400"
          echo "$out" | head -1 | grep -q "formatted yyyy-MM-dd" \
            || die "the 400 was NOT the date-format refusal: $(echo "$out" | head -1)"
          echo "  ok   Arabic-Indic-digit admittedOn -> 400 naming the format (was a silent empty 200 under \d)"

          # ---- THE REQUIREMENT FOLLOWS THE BED ------------------------------
          # diagnosis and attending are required WHEN A BED IS NAMED and
          # optional when one is not. Both directions are asserted, because
          # either half alone is compatible with the rule being wrong: proving
          # only that a bedless admission succeeds would also pass if the fields
          # had simply been dropped everywhere, which is the option this ruling
          # REJECTED — it would delete a guarantee that exists today on ICU's
          # shipped path.
          # The bedless direction already passed above (the office
          # Administrator admitted with neither field). What follows is the
          # WITH-BED direction, which needs adt.admit, so it runs under the
          # Consultant token.
          echo "REQUIREMENT FOLLOWS THE BED:"
          CIBED=$(PSQL "select \"BedId\" from \"Beds\" where \"Active\" and \"BedId\" not in (select \"BedId\" from \"Encounters\" where \"Status\" = 'open') order by \"Seq\" limit 1")
          [ -n "$CIBED" ] || die "no free bed in the production seed — the with-bed direction cannot be exercised"
          before_p=$(PSQL "select count(*) from \"AdtPatients\"")
          before_e=$(PSQL "select count(*) from \"Encounters\"")
          { [ -n "$before_p" ] && [ -n "$before_e" ]; } || die "row counts read back EMPTY — a nothing-written comparison would pass vacuously"
          for missing in diagnosis attending; do
            if [ "$missing" = "diagnosis" ]; then
              body="{\"nameFirst\":\"Bed\",\"nameSecond\":\"Rule\",\"nameFamily\":\"$missing\",\"sex\":\"M\",\"allergies\":\"None\",\"dateOfBirth\":\"1980-01-01\",\"attending\":\"CI Consultant\",\"bedId\":\"$CIBED\"}"
            else
              body="{\"nameFirst\":\"Bed\",\"nameSecond\":\"Rule\",\"nameFamily\":\"$missing\",\"sex\":\"M\",\"allergies\":\"None\",\"dateOfBirth\":\"1980-01-01\",\"diagnosis\":\"CI probe\",\"bedId\":\"$CIBED\"}"
            fi
            out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' -d "$body" "$API/api/icu/adt/admissions")
            [ "$(echo "$out" | tail -1)" = "400" ] || die "bed named with $missing missing -> HTTP $(echo "$out" | tail -1), expected 400"
            echo "$out" | head -1 | grep -q "when a bed is named" || die "the 400 did not state the rule: $(echo "$out" | head -1)"
            # NOTHING WRITTEN — this endpoint creates a Patient when the MRN is
            # new, so a refused admission must leave no patient and no encounter.
            now_p=$(PSQL "select count(*) from \"AdtPatients\"")
            now_e=$(PSQL "select count(*) from \"Encounters\"")
            { [ "$now_p" = "$before_p" ] && [ "$now_e" = "$before_e" ]; } \
              || die "the refused admission ($missing missing) WROTE: patients $before_p->$now_p encounters $before_e->$now_e"
            echo "  ok   bed named + $missing missing -> 400 stating the rule, and NOTHING written (patients $now_p, encounters $now_e)"
          done
          # …and the same caller WITH both fields still admits into that bed,
          # so the refusals above are the missing fields and not the bed.
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' \
            -d "{\"nameFirst\":\"Bed\",\"nameSecond\":\"Rule\",\"nameFamily\":\"Complete\",\"sex\":\"M\",\"allergies\":\"None\",\"dateOfBirth\":\"1980-01-01\",\"diagnosis\":\"CI probe\",\"attending\":\"CI Consultant\",\"bedId\":\"$CIBED\"}" \
            "$API/api/icu/adt/admissions")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "bed named WITH both fields -> HTTP $(echo "$out" | tail -1), expected 200: $(echo "$out" | head -1)"
          echo "  ok   bed named WITH both fields -> 200 (ICU's shipped path is unchanged)"

          # ---- TRANSFER REFUSES A BEDLESS ENCOUNTER --------------------------
          # /transfer writes its audit detail as "{from} → {to}" where `from` is
          # the CURRENT bed. Reception opens episodes with NO bed (step 5) and
          # this endpoint predates that: on a bedless encounter it wrote
          # " → B-05" — a dangling arrow with an empty source, permanent in
          # EventsJson. Reachable from the shipped Discharges screen, which lists
          # every open encounter with no bed filter and offered Move on each row.
          # THE FIX IS REFUSAL, NOT A TIDIER STRING. Giving a bed to a bedless
          # patient is bed ASSIGNMENT (ward design §3.1 — "This is NOT a
          # transfer"), a path with its own atom — built in Ward PR A1 as
          # POST /assign-bed (its legs are below); this guard is the transfer
          # half of the bedless/bedded partition the two endpoints enforce.
          echo "TRANSFER REFUSES A BEDLESS ENCOUNTER:"
          # adt.transfer is NURSING authority — the Consultant and the office
          # Administrator minted above are both 403 here, so this leg needs its
          # own Nurse account. A clinical job title needs a justification.
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $ADM" -H 'Content-Type: application/json' \
            -d '{"username":"ci.transfer.rn","name":"CI Transfer Nurse","roles":["Staff Nurse"],"initialPassword":"CI-Transfer-RN-9xTmp","justification":"production-seed CI — bedless-transfer refusal proof"}' \
            "$API/api/icu/users")
          [ "$(echo "$out" | tail -1)" = "200" ] \
            || die "could not create the CI nurse -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          resp=$(curl -sf -X POST "$API/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"ci.transfer.rn","password":"CI-Transfer-RN-9xTmp"}')
          CT4=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["changeToken"])')
          RN=$(curl -sf -X POST "$API/api/auth/change-password" -H 'Content-Type: application/json' \
            -d "{\"token\":\"$CT4\",\"newPassword\":\"CI-Transfer-RN-9x\"}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["jobTitle"]=="Staff Nurse", d; print(d["token"])')
          [ -n "$RN" ] || die "no session token for the CI nurse"
          # A GENUINELY FREE BED, computed fresh. $CIBED is OCCUPIED by the
          # with-both-fields admission above, and transferring into an occupied
          # bed also 409s — which would make this assertion pass for the WRONG
          # REASON, indistinguishable from the refusal it is meant to prove.
          FREEBED=$(PSQL "select \"BedId\" from \"Beds\" where \"Active\" and \"BedId\" not in (select \"BedId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '') order by \"Seq\" limit 1")
          [ -n "$FREEBED" ] || die "no free bed — the bedless-transfer direction cannot be exercised"
          # $ENCID is the office Administrator's BEDLESS admission from the
          # label-snapshot leg. Assert that, rather than assume it.
          [ "$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")" = "" ] \
            || die "$ENCID unexpectedly HAS a bed — the bedless direction cannot be exercised"
          before_ev=$(PSQL "select \"EventsJson\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          [ -n "$before_ev" ] || die "EventsJson read back EMPTY — a byte-identical comparison would pass vacuously"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"$FREEBED\"}" "$API/api/icu/adt/encounters/$ENCID/transfer")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "bedless transfer -> HTTP $(echo "$out" | tail -1), expected 409: $(echo "$out" | head -1)"
          # the MESSAGE matters: a 409 could also mean occupied/retired/discharged,
          # and this must be the bedless one specifically.
          echo "$out" | head -1 | grep -q "nothing to transfer from" \
            || die "the 409 was NOT the bedless refusal: $(echo "$out" | head -1)"
          after_ev=$(PSQL "select \"EventsJson\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          [ "$before_ev" = "$after_ev" ] || die "THE REFUSAL WROTE TO THE AUDIT: [$after_ev]"
          echo "  ok   bedless transfer -> 409 stating the reason, EventsJson BYTE-IDENTICAL (nothing written)"
          # BOTH DIRECTIONS. The refusal alone would also pass if transfer were
          # simply broken, or if this nurse lacked authority — so the SAME token
          # must still move a BEDDED encounter, with the audit string unchanged.
          SRC=$(PSQL "select \"EncounterId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '' order by \"EncounterId\" limit 1")
          [ -n "$SRC" ] || die "no bedded open encounter — the real-transfer direction cannot be exercised"
          SRCBED=$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$SRC'")
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"$FREEBED\"}" "$API/api/icu/adt/encounters/$SRC/transfer")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "real transfer -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          detail=$(PSQL "select \"EventsJson\"::json->-1->>'detail' from \"Encounters\" where \"EncounterId\" = '$SRC'")
          [ "$detail" = "$SRCBED → $FREEBED" ] \
            || die "the transfer audit string CHANGED: got [$detail], expected [$SRCBED → $FREEBED]"
          [ "$(PSQL "select \"EventsJson\"::json->-1->>'action' from \"Encounters\" where \"EncounterId\" = '$SRC'")" = "transferred" ] \
            || die "the transfer action string changed"
          echo "  ok   real bed-to-bed transfer -> 200, audit detail exactly '$detail' — unchanged"

          # ---- A TYPED MRN REFUSES NON-ASCII DIGITS (the \d class fix) ------
          # .NET's \d matches ANY Unicode decimal digit, so the canonical-MRN
          # gate ^MRN-\d{6}$ accepted MRN-٠٠٠١٢٣ — six Arabic-Indic digits.
          # An identity correction could store an MRN Aurora's generator never
          # produces, MRN search (exact ASCII ==) never finds, and the
          # uniqueness guard never collides with. The gate is now [0-9]; the
          # refusal is asserted BY MESSAGE (03: a five-digit MRN shares the
          # 400), and the ASCII direction is asserted too — the refusal alone
          # would also pass if correction were simply broken.
          echo "MRN CORRECTION REFUSES NON-ASCII DIGITS:"
          MRNPID=$(PSQL "select \"PatientId\" from \"AdtPatients\" where \"NameFirst\" = 'Snap' and \"NameFamily\" = 'Case'")
          [ -n "$MRNPID" ] || die "the label-snapshot patient is missing — the MRN leg has no subject"
          MRN_BEFORE=$(PSQL "select \"Mrn\" from \"AdtPatients\" where \"PatientId\" = '$MRNPID'")
          for BAD in "MRN-٠٠٠١٢٣" "MRN-۰۰۰۱۲۳"; do
            out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
              -d "{\"mrn\":\"$BAD\",\"reason\":\"CI digit-class probe\"}" "$API/api/icu/adt/patients/$MRNPID/identity")
            [ "$(echo "$out" | tail -1)" = "400" ] || die "$BAD -> HTTP $(echo "$out" | tail -1), expected 400: $(echo "$out" | head -1)"
            echo "$out" | head -1 | grep -q "non-ASCII digits" \
              || die "the 400 was NOT the digit refusal: $(echo "$out" | head -1)"
          done
          [ "$(PSQL "select \"Mrn\" from \"AdtPatients\" where \"PatientId\" = '$MRNPID'")" = "$MRN_BEFORE" ] \
            || die "a refused correction CHANGED the MRN"
          echo "  ok   MRN-٠٠٠١٢٣ and MRN-۰۰۰۱۲۳ -> 400 naming the digit rule, MRN unchanged ($MRN_BEFORE)"
          # the ASCII control value must not collide with a randomly generated
          # MRN (NextMrn is Random.Shared) — pick a proven-free candidate
          CTRL=""
          for cand in MRN-424242 MRN-424243 MRN-424244; do
            [ -z "$(PSQL "select 1 from \"AdtPatients\" where \"Mrn\" = '$cand'")" ] && { CTRL=$cand; break; }
          done
          [ -n "$CTRL" ] || die "all three control MRNs are taken — investigate the seed"
          out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"mrn\":\"$CTRL\",\"reason\":\"CI digit-class ASCII control\"}" "$API/api/icu/adt/patients/$MRNPID/identity")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "the ASCII control -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          [ "$(PSQL "select \"Mrn\" from \"AdtPatients\" where \"PatientId\" = '$MRNPID'")" = "$CTRL" ] \
            || die "the ASCII correction did not store"
          echo "  ok   $CTRL (ASCII control) -> 200, stored — the gate narrowed, correction still works"

          # ---- THE BACKUP-STATUS ATOM SPLIT (backup ruling 2) ----------------
          # backup.status.view is READ-ONLY, split from backup.manage: the
          # office Administrator reads the health the shell banner shows and
          # CANNOT run a backup; a clinical profile can do neither. All three
          # directions, because any one alone is compatible with the split
          # being wrong (a widened gate would also pass the read).
          echo "BACKUP-STATUS ATOM SPLIT:"
          out=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $OFF" "$API/api/backup/status")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "office admin GET /backup/status -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          echo "$out" | head -1 | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["health"] in ("ok","stale","failed","none","offsite-none","offsite-stale","offsite-failed"), d; print("  ok   office Administrator reads backup status (health: " + d["health"] + ")")'
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/backup/run")
          [ "$rc" = "403" ] || die "office admin POST /backup/run -> HTTP $rc, expected 403 — the READ atom must not carry manage authority"
          echo "  ok   office Administrator CANNOT run a backup (403) — the split is real"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RN" "$API/api/backup/status")
          [ "$rc" = "403" ] || die "Staff Nurse GET /backup/status -> HTTP $rc, expected 403"
          echo "  ok   clinical profile (Staff Nurse) cannot read it (403)"

          # ---- WARD A1 — THE BEDLESS FILTER (GET /adt/encounters?bedless=true)
          # "open encounters with no bed assigned", IN FULL: the open half is
          # part of the filter's meaning — a BedId-only filter would hand every
          # closed bedless episode (day cases, §2.1) to the awaiting-bed
          # worklist. Derived from open && BedId == '' at read; never stored,
          # never a third Status value. $ENCID is the office Administrator's
          # bedless admission from the label-snapshot leg, still bedless here
          # (the transfer leg only proved refusal); the closed-bedless and
          # bedded exclusions each get a REAL subject, because an exclusion
          # asserted against nothing passes vacuously.
          echo "WARD A1 - BEDLESS FILTER:"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"nameFirst":"Ward","nameSecond":"A1","nameFamily":"Closed","sex":"M","allergies":"None","dateOfBirth":"1985-05-05"}' \
            "$API/api/icu/adt/admissions")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "the closed-subject admission -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          WCLOSED=$(echo "$out" | head -1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["encounter"]["encounterId"])')
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' -d '{}' "$API/api/icu/adt/encounters/$WCLOSED/discharge")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "discharging $WCLOSED -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          BEDDED=$(PSQL "select \"EncounterId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '' order by \"EncounterId\" limit 1")
          [ -n "$BEDDED" ] || die "no bedded open encounter — the bedded-exclusion direction cannot be exercised"
          curl -sf -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?bedless=true" -o /tmp/ward-bedless.json \
            || die "bedless query failed"
          ENCID="$ENCID" WCLOSED="$WCLOSED" BEDDED="$BEDDED" python3 -c '
          import json, os
          rows = json.load(open("/tmp/ward-bedless.json"))
          ids = [r["encounterId"] for r in rows]
          assert os.environ["ENCID"] in ids, ("the open bedless encounter is missing", ids)
          assert os.environ["WCLOSED"] not in ids, ("a CLOSED bedless encounter is listed", ids)
          assert os.environ["BEDDED"] not in ids, ("a BEDDED encounter is listed", ids)
          assert all(r["status"] == "open" and r["bedId"] == "" for r in rows), rows
          print(f"  ok   bedless=true -> {len(ids)} row(s), open+bedless only (open-bedless in, closed-bedless out, bedded out)")'
          rc=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?bedless=true&status=open")
          [ "$rc" = "200" ] || die "bedless=true&status=open -> HTTP $rc, expected 200 (redundant but legal)"
          # the two 400s, BY MESSAGE (03: a malformed-value 400 and a
          # contradiction 400 share the code; only the message tells them apart)
          out=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?bedless=true&status=discharged")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "bedless+discharged -> HTTP $(echo "$out" | tail -1), expected 400"
          echo "$out" | head -1 | grep -q "cannot combine with status=discharged" \
            || die "the 400 was NOT the contradiction refusal: $(echo "$out" | head -1)"
          out=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?bedless=banana")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "bedless=banana -> HTTP $(echo "$out" | tail -1), expected 400"
          echo "$out" | head -1 | grep -q "bedless must be" \
            || die "the 400 was NOT the value refusal: $(echo "$out" | head -1)"
          echo "  ok   bedless&status=open 200 · bedless&status=discharged 400 (contradiction) · bedless=banana 400 (value rule)"

          # ---- WARD A1 — BED ASSIGNMENT (POST /adt/encounters/{id}/assign-bed)
          # The ward design §3.1 path: its OWN route, its OWN atom
          # (beds.assign — office Administrator + Nurse, NOT doctors), its OWN
          # action string ("bed assigned"), an audit detail that names a
          # DESTINATION ONLY, and the partition with transfer: bedless →
          # assignment, bedded → transfer, enforced from both sides. Every
          # refusal is asserted BY MESSAGE (03: five causes share two codes
          # here) and proven to write NOTHING against the database itself.
          echo "WARD A1 - BED ASSIGNMENT:"
          wa_p=$(PSQL "select count(*) from \"AdtPatients\"")
          wa_e=$(PSQL "select count(*) from \"Encounters\"")
          wa_b=$(PSQL "select count(*) from \"Beds\"")
          { [ -n "$wa_p" ] && [ -n "$wa_e" ] && [ -n "$wa_b" ]; } || die "row counts read back EMPTY — nothing-written comparisons would pass vacuously"
          wa_ev=$(PSQL "select \"EventsJson\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          [ -n "$wa_ev" ] || die "EventsJson read back EMPTY — a byte-identical comparison would pass vacuously"
          wa_refused() { # label expected_code message_substring token encounterId bedId
            out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $4" -H 'Content-Type: application/json' \
              -d "{\"bedId\":\"$6\"}" "$API/api/icu/adt/encounters/$5/assign-bed")
            [ "$(echo "$out" | tail -1)" = "$2" ] || die "$1 -> HTTP $(echo "$out" | tail -1), expected $2: $(echo "$out" | head -1)"
            if [ -n "$3" ]; then
              echo "$out" | head -1 | grep -q "$3" || die "$1: the $2 was NOT the expected refusal: $(echo "$out" | head -1)"
            fi
            [ "$(PSQL "select count(*) from \"AdtPatients\"")" = "$wa_p" ] || die "$1 WROTE a patient row"
            [ "$(PSQL "select count(*) from \"Encounters\"")" = "$wa_e" ] || die "$1 WROTE an encounter row"
            [ "$(PSQL "select count(*) from \"Beds\"")" = "$wa_b" ] || die "$1 WROTE a bed row"
            [ "$(PSQL "select \"EventsJson\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")" = "$wa_ev" ] || die "$1 WROTE to the audit"
            [ "$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")" = "" ] || die "$1 assigned a bed"
            echo "  ok   $1 -> $2 with the right message, NOTHING written"
          }
          wa_refused "nonexistent bed" 400 "does not match any bed" "$OFF" "$ENCID" "NO-SUCH-BED-A1"
          # a retired bed needs to EXIST retired: create + deactivate via
          # beds.manage (the office Administrator holds it), then re-snapshot
          # the beds count — the setup legitimately added one row.
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"bedId":"CI-A1-RET","area":"Pod A","seq":9001}' "$API/api/icu/adt/beds")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "creating CI-A1-RET -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/adt/beds/CI-A1-RET/deactivate")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "retiring CI-A1-RET -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          wa_b=$(PSQL "select count(*) from \"Beds\"")
          wa_refused "retired bed" 409 "is retired" "$OFF" "$ENCID" "CI-A1-RET"
          OCCBED=$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$BEDDED'")
          [ -n "$OCCBED" ] || die "the bedded encounter lost its bed — the occupied direction cannot be exercised"
          wa_refused "occupied bed" 409 "already occupied" "$OFF" "$ENCID" "$OCCBED"
          # closed encounter: aim at a FREE ACTIVE bed so the closed status is
          # the ONLY possible cause — and the message assertion pins it anyway
          # (03: this 409 shares its code with occupied/retired).
          A1FREE=$(PSQL "select \"BedId\" from \"Beds\" where \"Active\" and \"BedId\" not in (select \"BedId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '') order by \"Seq\" limit 1")
          [ -n "$A1FREE" ] || die "no free bed — the closed-encounter direction cannot be exercised"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"$A1FREE\"}" "$API/api/icu/adt/encounters/$WCLOSED/assign-bed")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "assign on closed encounter -> HTTP $(echo "$out" | tail -1), expected 409: $(echo "$out" | head -1)"
          echo "$out" | head -1 | grep -q "closed encounter cannot be assigned a bed" \
            || die "the 409 was NOT the closed refusal: $(echo "$out" | head -1)"
          [ "$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$WCLOSED'")" = "" ] || die "the closed encounter GAINED a bed"
          echo "  ok   closed encounter -> 409 with the right message, nothing written"
          # doctors do NOT gain placement authority (the atom is the desk's
          # and the ward's — Consultant reaches the RBAC line and stops)
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $DOC" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"$A1FREE\"}" "$API/api/icu/adt/encounters/$ENCID/assign-bed")
          [ "$rc" = "403" ] || die "Consultant assign -> HTTP $rc, expected 403 — doctors must not gain beds.assign"
          echo "  ok   Consultant assign -> 403 (no new placement authority for doctors)"
          # THE VALID ASSIGNMENT — office Administrator direction. Audit: the
          # assignment's OWN action string, and a detail naming the
          # DESTINATION ONLY — an assignment has no source bed, so the "→"
          # of the transfer detail must never appear.
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"$A1FREE\"}" "$API/api/icu/adt/encounters/$ENCID/assign-bed")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "office Administrator assign -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          [ "$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$ENCID'")" = "$A1FREE" ] || die "the assignment did not store"
          wa_act=$(PSQL "select \"EventsJson\"::json->-1->>'action' from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          wa_det=$(PSQL "select \"EventsJson\"::json->-1->>'detail' from \"Encounters\" where \"EncounterId\" = '$ENCID'")
          [ "$wa_act" = "bed assigned" ] || die "audit action is [$wa_act], expected [bed assigned]"
          [ "$wa_det" = "to $A1FREE" ] || die "audit detail is [$wa_det], expected [to $A1FREE]"
          case "$wa_det" in *"→"*) die "the assignment detail implies a SOURCE bed: [$wa_det]";; esac
          echo "  ok   office Administrator assigned $A1FREE -> 200; audit action 'bed assigned', detail 'to $A1FREE' (destination only, no fake source)"
          # THE PARTITION, enforced from the assignment side: the encounter is
          # now BEDDED, so a second assignment is refused — moves are
          # transfers. (The transfer side of the partition — bedless → 409
          # "nothing to transfer from" — is the leg above.)
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"NO-SUCH-BED-A1\"}" "$API/api/icu/adt/encounters/$ENCID/assign-bed")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "assign on bedded encounter -> HTTP $(echo "$out" | tail -1), expected 409: $(echo "$out" | head -1)"
          echo "$out" | head -1 | grep -q "is a transfer, not an assignment" \
            || die "the 409 was NOT the partition refusal: $(echo "$out" | head -1)"
          echo "  ok   already-bedded -> 409 naming the partition (moving a bedded patient is a transfer)"
          # ...and the assigned encounter has LEFT the bedless list — the
          # awaiting-bed state is derived from the bed field, never stored.
          curl -sf -H "Authorization: Bearer $OFF" "$API/api/icu/adt/encounters?bedless=true" -o /tmp/ward-bedless2.json \
            || die "bedless re-query failed"
          ENCID="$ENCID" python3 -c '
          import json, os
          ids = [r["encounterId"] for r in json.load(open("/tmp/ward-bedless2.json"))]
          assert os.environ["ENCID"] not in ids, ("the assigned encounter is still listed bedless", ids)
          print("  ok   the assigned encounter left the bedless list (derived state, nothing stored)")'
          # THE NURSE DIRECTION — the atom's second holder assigns a fresh
          # bedless admission. Without this, green cannot tell "the pair holds
          # the atom" from "only the office does".
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"nameFirst":"Ward","nameSecond":"A1","nameFamily":"NurseAssign","sex":"F","allergies":"None","dateOfBirth":"1985-05-05"}' \
            "$API/api/icu/adt/admissions")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "the nurse-direction admission -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          WNURSE=$(echo "$out" | head -1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["encounter"]["encounterId"])')
          A1FREE2=$(PSQL "select \"BedId\" from \"Beds\" where \"Active\" and \"BedId\" not in (select \"BedId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '') order by \"Seq\" limit 1")
          [ -n "$A1FREE2" ] || die "no free bed — the nurse direction cannot be exercised"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"$A1FREE2\"}" "$API/api/icu/adt/encounters/$WNURSE/assign-bed")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "Staff Nurse assign -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          [ "$(PSQL "select \"BedId\" from \"Encounters\" where \"EncounterId\" = '$WNURSE'")" = "$A1FREE2" ] || die "the nurse assignment did not store"
          echo "  ok   Staff Nurse assigned $A1FREE2 -> 200 (the atom's second holder)"
          # NEITHER HOLDER GAINS adt.admit: a bed-NAMED admission stays 403
          # for both. (For the office Administrator the refusal is the
          # adt.admit check itself; for the Nurse it fires at
          # admissions.create — the FIRST gate — which proves the same
          # outcome: beds.assign unlocked no admission-with-bed for either.)
          for actor in OFF RN; do
            eval "T=\$$actor"
            rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
              -d '{"nameFirst":"Ward","nameSecond":"A1","nameFamily":"Deny","sex":"M","allergies":"None","dateOfBirth":"1985-05-05","diagnosis":"x","attending":"y","bedId":"ICU-01"}' \
              "$API/api/icu/adt/admissions")
            [ "$rc" = "403" ] || die "$actor bed-named admission -> HTTP $rc, expected 403 — beds.assign must not unlock admitting into a bed"
          done
          echo "  ok   neither the office Administrator nor the Nurse can admit INTO a bed (403 both — beds.assign is not adt.admit)"

          # ==== WARD B (ward.md Amendment A1, the owner's ruling) ============
          # Area promoted to the governed Wards vocabulary; the bed edit path;
          # ward-to-ward DERIVED from the beds, never claimed or stored. The
          # A1/A2 regression evidence is the WARD A1 + BEDLESS FILTER legs
          # ABOVE, which run unchanged in this same step on every commit.
          # ---- the backfill: honest promotion, nothing invented -------------
          echo "WARD B - THE BACKFILL:"
          WCOUNT=$(PSQL "select count(*) from \"Wards\"")
          DAREAS=$(PSQL "select count(distinct \"Area\") from \"Beds\"")
          [ "$WCOUNT" = "$DAREAS" ] || die "Wards has $WCOUNT rows, beds carry $DAREAS distinct areas — the backfill invented or missed"
          [ "$WCOUNT" -gt 0 ] || die "Wards is EMPTY — the backfill did not run (a vacuous equality would hide this)"
          [ "$(PSQL "select count(*) from \"Wards\" where \"Code\" = \"Label\"")" = "$WCOUNT" ] || die "a backfilled ward's code != label"
          [ "$(PSQL "select count(*) from \"Wards\" w where not exists (select 1 from \"Beds\" b where b.\"Area\" = w.\"Code\")")" = "0" ] \
            || die "a backfilled ward matches NO bed — something was invented"
          echo "  ok   Wards == exactly the bed registry's distinct areas ($WCOUNT), code==label, nothing invented"
          # ---- vocabulary RBAC + lifecycle ---------------------------------
          echo "WARD B - VOCABULARY RBAC + LIFECYCLE:"
          for tok in DOC RN; do
            eval "T=\$$tok"
            rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
              -d '{"label":"a clinical profile must not configure wards"}' "$API/api/icu/wards")
            [ "$rc" = "403" ] || die "$tok POST /wards -> HTTP $rc, expected 403"
          done
          rc=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RN" "$API/api/icu/wards")
          [ "$rc" = "200" ] || die "GET /wards as nurse -> HTTP $rc — the vocabulary must READ for any session (labels resolve everywhere)"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"label":"CI Ward B"}' "$API/api/icu/wards")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "office admin ward create -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          W1=$(echo "$out" | head -1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"label":"CI Ward B Renamed"}' "$API/api/icu/wards/$W1")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "ward label edit -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          [ "$(PSQL "select \"EventsJson\"::json->-1->>'action' from \"Wards\" where \"Code\" = '$W1'")" = "changed" ] || die "the rename is not audited"
          echo "  ok   clinical profiles 403 · any session reads · office admin creates '$W1' + renames it, audited"
          # ---- the retire guard, BOTH directions ---------------------------
          echo "WARD B - RETIRE GUARD:"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/wards/Pod%20A/deactivate")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "retiring Pod A (active beds) -> HTTP $(echo "$out" | tail -1), expected 409: $(echo "$out" | head -1)"
          echo "$out" | head -1 | grep -q "active bed" || die "the 409 was NOT the active-beds refusal: $(echo "$out" | head -1)"
          [ "$(PSQL "select \"Active\" from \"Wards\" where \"Code\" = 'Pod A'")" = "t" ] || die "the refused retirement RETIRED Pod A anyway"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/wards/$W1/deactivate")
          [ "$rc" = "200" ] || die "retiring the bedless '$W1' -> HTTP $rc"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/wards/$W1/reactivate")
          [ "$rc" = "200" ] || die "reactivating '$W1' -> HTTP $rc"
          echo "  ok   active beds block retirement (409 naming them, nothing written); a bedless ward retires + reactivates"
          # ---- bed placement guards (create) -------------------------------
          echo "WARD B - BED PLACEMENT:"
          wb_beds=$(PSQL "select count(*) from \"Beds\"")
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"bedId":"CI-WB-1","area":"NO-SUCH-WARD","seq":9101}' "$API/api/icu/adt/beds")
          [ "$(echo "$out" | tail -1)" = "400" ] || die "bed create with unknown ward -> HTTP $(echo "$out" | tail -1), expected 400: $(echo "$out" | head -1)"
          echo "$out" | head -1 | grep -q "does not match any ward" || die "the 400 was NOT the unknown-ward refusal: $(echo "$out" | head -1)"
          [ "$(PSQL "select count(*) from \"Beds\"")" = "$wb_beds" ] || die "the refused create WROTE a bed"
          W2=$(curl -sf -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' -d '{"label":"CI Ward B Retired"}' "$API/api/icu/wards" | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/wards/$W2/deactivate")
          [ "$rc" = "200" ] || die "retiring W2 -> $rc"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"CI-WB-1\",\"area\":\"$W2\",\"seq\":9101}" "$API/api/icu/adt/beds")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "bed create in a RETIRED ward -> HTTP $(echo "$out" | tail -1), expected 409: $(echo "$out" | head -1)"
          echo "$out" | head -1 | grep -q "is retired" || die "the 409 was NOT the retired-ward refusal: $(echo "$out" | head -1)"
          [ "$(PSQL "select count(*) from \"Beds\"")" = "$wb_beds" ] || die "the refused create WROTE a bed"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"bedId\":\"CI-WB-1\",\"area\":\"$W1\",\"seq\":9101}" "$API/api/icu/adt/beds")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "bed create in the active '$W1' -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          out=$(curl -s -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/wards/$W1/deactivate")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "retiring '$W1' (now has CI-WB-1) -> HTTP $(echo "$out" | tail -1), expected 409"
          echo "$out" | head -1 | grep -q "CI-WB-1" || die "the 409 does not NAME the blocking bed: $(echo "$out" | head -1)"
          echo "  ok   unknown ward 400 · retired ward 409 · nothing written · the new bed arms the retire guard by name"
          # ---- the bed EDIT path -------------------------------------------
          echo "WARD B - BED EDIT:"
          wb_ev0=$(PSQL "select \"EventsJson\" from \"Beds\" where \"BedId\" = 'CI-WB-1'")
          [ -n "$wb_ev0" ] || die "CI-WB-1 EventsJson read back EMPTY"
          wb_refedit() { # label code grep body
            out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
              -d "$4" "$API/api/icu/adt/beds/CI-WB-1")
            [ "$(echo "$out" | tail -1)" = "$2" ] || die "$1 -> HTTP $(echo "$out" | tail -1), expected $2: $(echo "$out" | head -1)"
            [ -z "$3" ] || echo "$out" | head -1 | grep -q "$3" || die "$1: wrong message: $(echo "$out" | head -1)"
            [ "$(PSQL "select \"Area\" from \"Beds\" where \"BedId\" = 'CI-WB-1'")" = "$W1" ] || die "$1 CHANGED the area"
            [ "$(PSQL "select \"EventsJson\" from \"Beds\" where \"BedId\" = 'CI-WB-1'")" = "$wb_ev0" ] || die "$1 WROTE audit"
            echo "  ok   $1 -> $2, nothing written"
          }
          wb_refedit "edit to an unknown ward" 400 "does not match any ward" '{"area":"NO-SUCH-WARD"}'
          wb_refedit "edit to the retired ward" 409 "is retired" "{\"area\":\"$W2\"}"
          wb_refedit "no-change edit" 400 "no field change" "{\"area\":\"$W1\",\"seq\":9101}"
          wb_refedit "edit claiming a new bedId" 400 "" "{\"bedId\":\"CI-WB-RENAMED\",\"area\":\"Pod B\"}"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' -d '{"area":"Pod B"}' "$API/api/icu/adt/beds/CI-WB-1")
          [ "$rc" = "403" ] || die "Nurse bed edit -> HTTP $rc, expected 403 (beds.manage)"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' -d '{"area":"Pod B"}' "$API/api/icu/adt/beds/NO-SUCH-BED")
          [ "$rc" = "404" ] || die "edit of an unknown bed -> HTTP $rc, expected 404"
          echo "  ok   Nurse 403 · unknown bed 404"
          # occupied: an A1 leg left a bedded encounter — pick its bed fresh
          OCCB=$(PSQL "select \"BedId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '' order by \"EncounterId\" limit 1")
          [ -n "$OCCB" ] || die "no occupied bed — the occupied direction cannot be exercised"
          occ_area=$(PSQL "select \"Area\" from \"Beds\" where \"BedId\" = '$OCCB'")
          out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"area\":\"$([ "$occ_area" = "Pod A" ] && echo "Pod B" || echo "Pod A")\"}" "$API/api/icu/adt/beds/$OCCB")
          [ "$(echo "$out" | tail -1)" = "409" ] || die "area change on OCCUPIED $OCCB -> HTTP $(echo "$out" | tail -1), expected 409: $(echo "$out" | head -1)"
          echo "$out" | head -1 | grep -q "cannot change the ward of a bed a patient is in" || die "the 409 was NOT the occupied refusal: $(echo "$out" | head -1)"
          [ "$(PSQL "select \"Area\" from \"Beds\" where \"BedId\" = '$OCCB'")" = "$occ_area" ] || die "the refused move CHANGED the ward"
          out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d "{\"area\":\"$occ_area\",\"seq\":9555}" "$API/api/icu/adt/beds/$OCCB")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "seq-only edit on the occupied bed -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          echo "  ok   occupied bed: area change 409 by message (ward unchanged) · seq-only edit 200 (no location hazard)"
          # the RE-PARENT — the ruling's typo-fix flow end to end
          out=$(curl -s -w '\n%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' \
            -d '{"area":"Pod B"}' "$API/api/icu/adt/beds/CI-WB-1")
          [ "$(echo "$out" | tail -1)" = "200" ] || die "re-parent CI-WB-1 -> HTTP $(echo "$out" | tail -1): $(echo "$out" | head -1)"
          [ "$(PSQL "select \"Area\" from \"Beds\" where \"BedId\" = 'CI-WB-1'")" = "Pod B" ] || die "the re-parent did not store"
          PSQL "select \"EventsJson\"::json->-1->>'detail' from \"Beds\" where \"BedId\" = 'CI-WB-1'" | grep -q "ward '$W1' → 'Pod B'" \
            || die "the re-parent audit detail is wrong"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $OFF" "$API/api/icu/wards/$W1/deactivate")
          [ "$rc" = "200" ] || die "retiring '$W1' after its bed moved away -> HTTP $rc — the guard did not release"
          echo "  ok   re-parent stored + audited with the prior ward named; the emptied ward then retires (typo-fix flow END TO END)"
          # ---- label resolution: a rename actually renames ------------------
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $OFF" -H 'Content-Type: application/json' -d '{"label":"Pod B Renamed"}' "$API/api/icu/wards/Pod%20B")
          [ "$rc" = "200" ] || die "renaming Pod B -> $rc"
          curl -sf -H "Authorization: Bearer $OFF" "$API/api/icu/adt/beds" -o /tmp/wb-beds.json || die "beds read failed"
          python3 -c '
          import json
          rows = json.load(open("/tmp/wb-beds.json"))
          b = next(r for r in rows if r["bedId"] == "CI-WB-1")
          assert b["area"] == "Pod B", b
          assert b.get("wardLabel") == "Pod B Renamed", b
          print("  ok   beds read: area stays the CODE, wardLabel resolves to the new name (rename renames everywhere)")'
          # ---- ward-to-ward: DERIVED from the beds, never claimed or stored -
          echo "WARD B - WARD-TO-WARD DERIVATION:"
          [ "$(PSQL "select count(*) from information_schema.columns where table_name = 'Encounters' and column_name ilike '%ward%'")" = "0" ] \
            || die "the Encounters table has a ward column — derivation was stored"
          OCC_ENC=$(PSQL "select \"EncounterId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" = '$OCCB'")
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' \
            -d '{"bedId":"CI-WB-1","wardTo":"Pod A"}' "$API/api/icu/adt/encounters/$OCC_ENC/transfer")
          [ "$rc" = "400" ] || die "a transfer CLAIMING a ward -> HTTP $rc, expected a binding 400 — the wards must come from the beds"
          T_SAME=$(PSQL "select \"BedId\" from \"Beds\" where \"Active\" and \"Area\" = '$occ_area' and \"BedId\" <> '$OCCB' and \"BedId\" not in (select \"BedId\" from \"Encounters\" where \"Status\" = 'open' and \"BedId\" <> '') order by \"Seq\" limit 1")
          [ -n "$T_SAME" ] || die "no second free bed in '$occ_area' — the same-ward direction cannot be exercised"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' -d "{\"bedId\":\"$T_SAME\"}" "$API/api/icu/adt/encounters/$OCC_ENC/transfer")
          [ "$rc" = "200" ] || die "same-ward transfer -> $rc"
          [ "$(PSQL "select \"Area\" from \"Beds\" where \"BedId\" = '$T_SAME'")" = "$occ_area" ] || die "test bug: expected same-ward target"
          det=$(PSQL "select \"EventsJson\"::json->-1->>'detail' from \"Encounters\" where \"EncounterId\" = '$OCC_ENC'")
          [ "$det" = "$OCCB → $T_SAME" ] || die "same-ward transfer audit changed: [$det]"
          echo "  ok   same-ward move: both beds' wards derive EQUAL ('$occ_area') — NOT ward-to-ward; audit unchanged '$det'"
          rc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $RN" -H 'Content-Type: application/json' -d '{"bedId":"CI-WB-1"}' "$API/api/icu/adt/encounters/$OCC_ENC/transfer")
          [ "$rc" = "200" ] || die "cross-ward transfer -> $rc"
          [ "$(PSQL "select \"Area\" from \"Beds\" where \"BedId\" = 'CI-WB-1'")" != "$occ_area" ] || die "test bug: expected cross-ward target"
          det2=$(PSQL "select \"EventsJson\"::json->-1->>'detail' from \"Encounters\" where \"EncounterId\" = '$OCC_ENC'")
          [ "$det2" = "$T_SAME → CI-WB-1" ] || die "cross-ward transfer audit changed: [$det2]"
          case "$det2" in *Pod*|*ward*|*Ward*) die "the transfer audit STORED ward text: [$det2]";; esac
          echo "  ok   cross-ward move: the beds' wards derive DIFFERENT = ward-to-ward, from the ACTUAL beds; audit stays bed-ids-only '$det2'"
          echo "  ok   encounter schema carries NO ward column · a caller cannot claim a transition (binding 400) — derived stays derived"

  # installer-powershell — the Windows PowerShell 5.1 gate.
  #
  # Why this job exists: aurora-update.ps1 shipped with PowerShell 7 ternary
  # syntax (`$a ? $b : $c`). aurora.iss and aurora-update.iss both launch their
  # scripts with `powershell.exe`, which is Windows PowerShell 5.1 on every
  # hospital server — and 5.1 rejects that syntax at PARSE time, killing the
  # whole file before a single statement runs. So NO hospital could have applied
  # ANY update. It survived because CI ran no PowerShell at all and the unit
  # tests ran on pwsh 7, which parses it happily. Two things close that gap:
  #   1. every installer .ps1 is parsed by the real 5.1 engine, and
  #   2. the update guard's pure unit tests RUN on 5.1, not just on pwsh 7.
  # The engine matters as much as the assertions — that is the whole lesson.
  installer-powershell:
    runs-on: windows-latest
    # One step deliberately RUNS build-protected.ps1 to prove the version gate
    # refuses. If a future change ever let it past the gate it would reach an
    # interactive Read-Host; cap the job rather than let that sit for hours.
    # The cap also bounds the real update-package staging run at the end
    # (npm ci + vite build + a self-contained win-x64 publish).
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell        # Windows PowerShell 5.1 — NOT pwsh 7
    steps:
      - uses: actions/checkout@v4

      # CI-evidence rule: a gate that silently ran the wrong engine is
      # indistinguishable from a gate that passed. Prove the engine first.
      - name: Prove this really is Windows PowerShell 5.1
        run: |
          $PSVersionTable | Format-List | Out-String | Write-Host
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Host "FAIL - expected Windows PowerShell 5.x, got $($PSVersionTable.PSVersion)"
            Write-Host "This gate would not be testing what hospital servers actually run."
            exit 1
          }
          Write-Host "confirmed: PowerShell $($PSVersionTable.PSVersion)"

      # A gate that cannot fail proves nothing (the CI-evidence rule again).
      # Feed the parser the EXACT construct that shipped and assert it is
      # REJECTED here. If a future runner image ever provided a PS7 parser to
      # this step, this fails loudly instead of waving the real defect through.
      - name: Prove the gate has teeth (a PS7 ternary must NOT parse here)
        run: |
          $snippet = '$x = $true ? 1 : 2'
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($snippet, [ref]$tokens, [ref]$errors)
          if (-not $errors -or $errors.Count -eq 0) {
            Write-Host "FAIL - this parser ACCEPTED: $snippet"
            Write-Host "That is PowerShell 7-only syntax. A parser that accepts it cannot catch the defect this job exists to catch."
            exit 1
          }
          Write-Host "confirmed: the 5.1 parser rejects a ternary - $($errors[0].Message)"

      - name: Every installer .ps1 must PARSE under 5.1
        run: |
          $files = @(Get-ChildItem installer -Filter *.ps1 -File | Sort-Object Name)
          if ($files.Count -lt 5) {
            Write-Host "FAIL - found only $($files.Count) installer .ps1 file(s); the gate would pass vacuously"
            exit 1
          }
          $bad = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              Write-Host ("FAIL  " + $f.Name)
              foreach ($e in $errors) {
                Write-Host ("        line " + $e.Extent.StartLineNumber + ": " + $e.Message)
              }
            } else {
              Write-Host ("ok    " + $f.Name)
            }
          }
          Write-Host ("parsed " + $files.Count + " installer script(s) under PowerShell " + $PSVersionTable.PSVersion)
          if ($bad -gt 0) {
            Write-Host ("FAIL - " + $bad + " installer script(s) do not parse under Windows PowerShell 5.1.")
            Write-Host "They would fail at LOAD time on a hospital server. Common cause: PowerShell 7-only"
            Write-Host "syntax (the '? :' ternary, '??', '?.') - rewrite with if/else."
            exit 1
          }

      - name: Update-guard pure unit tests, ON 5.1
        run: .\installer\test-update-pure.ps1

      # The pure tests above run IN-PROCESS and therefore cannot see an exit
      # code. Three defects shipped through that blind spot and were found in
      # the field on 2026-08-06, all in aurora-update.ps1's failure path:
      #   - $ErrorActionPreference='Stop' made the bare Write-Error in Fail /
      #     FailBetweenStates / FailRolledBack TERMINATING, so the `exit N`
      #     after it never ran. Every failure exited 1; codes 2 and 3 were
      #     unreachable and the wizard showed "NOT applied ... Nothing needs to
      #     be recovered" for a swap that died with the service stopped.
      #   - FailRolledBack is called from INSIDE the rollback try{}, so that
      #     terminating error hit its catch{} and a SUCCESSFUL rollback was
      #     reported as "CRITICAL: the automatic rollback could not complete".
      #   - aurora-update.iss always passed -InstallDir, which the script read
      #     as a supervised override, so the AuroraServer service lookup was
      #     dead code in the only path that ships.
      # This step runs the REAL definitions in REAL child processes and asserts
      # the REAL exit codes, plus the .iss <-> .ps1 argument contract that no
      # single-file test can see. Verified to FAIL against the pre-fix code.
      - name: Updater EXIT CODES + install-dir resolution, end-to-end ON 5.1
        run: .\installer\test-update-exitcodes.ps1

      # A process the installer launches with SW_HIDE must never be able to
      # block on stdin - there is no console to answer it and the window cannot
      # be closed. aurora-update.ps1 invoked psql with the connection URI as the
      # FIRST argument; psql's Windows getopt does not permute, so -tAc and the
      # SQL became positionals, psql started an INTERACTIVE session, and the
      # update hung forever (real field failure, 2026-08-05). -w / --no-password
      # makes psql fail instead of prompting, which kills the whole class
      # regardless of argument order. Assert it on every psql call.
      - name: Every psql invocation must pass -w (no process may wait on a hidden stdin)
        run: |
          $bad = @(); $seen = 0
          foreach ($f in Get-ChildItem installer -Filter *.ps1 -File) {
            $n = 0
            foreach ($line in (Get-Content $f.FullName)) {
              $n++
              $t = $line.Trim()
              if ($t.StartsWith('#')) { continue }
              # A line that TESTS for psql invocations is not one. The exit-code
              # suite lints aurora-update.ps1's own native calls, so its matcher
              # contains a psql-shaped regex literal - which this gate read as a
              # real call and failed on (2026-08-06). A lint must not fail on
              # another lint's pattern.
              if ($t -match '-match|-notmatch') { continue }
              # an actual invocation: '&' followed by something naming psql
              if ($t -notmatch '&\s*[^\r\n]*psql') { continue }
              if ($t -notmatch '\bpsql(\.exe)?') { continue }
              $seen++
              if ($t -notmatch '\s-w\b' -and $t -notmatch '--no-password') {
                $bad += ("{0}:{1}  {2}" -f $f.Name, $n, $t)
              }
            }
          }
          if ($seen -lt 1) { Write-Host "FAIL - found no psql invocations at all; this gate would pass vacuously"; exit 1 }
          Write-Host "checked $seen psql invocation(s)"
          if ($bad.Count -gt 0) {
            Write-Host "FAIL - these psql calls can prompt for a password and hang a hidden console:"
            $bad | ForEach-Object { Write-Host "    $_" }
            Write-Host "Add -w (--no-password) so psql FAILS instead of waiting on stdin."
            exit 1
          }
          Write-Host "confirmed: every psql invocation passes -w"
          exit 0

      # Release version gate. A release built at a version that already shipped
      # is refused by every hospital SILENTLY (aurora-update's "not newer than
      # installed" skew refusal): the update reports success-by-inaction and
      # the new code never runs. build-protected.ps1 refuses to compile such a
      # build by reading installer\SHIPPED_VERSIONS.txt. These tests cover the
      # gate itself AND assert the committed ledger is valid and that
      # aurora.iss AppVer is not behind what has already shipped.
      - name: Provisioning REGISTERS the backup task + firewall - measured on this real Windows runner (backup ruling 3)
        shell: powershell
        run: |
          # The field failure all three backup rulings answer: a production
          # install's log claimed the AuroraBackup task and firewall rule and
          # the machine had NEITHER. This leg runs the SAME registration code
          # aurora-provision.ps1 runs (dot-sourced from
          # aurora-backup-task.ps1 - one implementation, no fork) and asserts
          # the task and the rule actually exist afterwards. The probes see
          # BOTH states of the world in one run (absence before, presence
          # after, absence again after cleanup) - a vacuous probe that
          # answers the same in both worlds cannot pass this leg.
          $ErrorActionPreference = 'Stop'
          . .\installer\aurora-backup-task.ps1
          $taskName = 'AuroraBackup'
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) { Write-Host 'FAIL - task exists before registration; the absence half of the probe is broken'; exit 1 }
          Write-Host 'ok   pre-state: no AuroraBackup task (the probe sees absence)'
          $script = Join-Path $PWD 'installer\aurora-backup.ps1'
          try { $t = Register-AuroraBackupTask -BackupScript $script -WorkingDir "$PWD" }
          catch { Write-Host "FAIL - $($_.Exception.Message)"; exit 1 }
          $found = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if (-not $found) { Write-Host 'FAIL - the leg cannot find the task the function claims it verified'; exit 1 }
          Write-Host "ok   AuroraBackup task EXISTS on the runner (state: $($found.State))"
          $tr = $found.Triggers | Select-Object -First 1
          if ("$($tr.StartBoundary)" -notmatch 'T02:00') { Write-Host "FAIL - trigger is not 02:00: $($tr.StartBoundary)"; exit 1 }
          Write-Host 'ok   daily at 02:00 confirmed from the REGISTERED trigger, not the script text'
          try {
            [void](Register-AuroraFirewallRule -Port 48620 -DisplayName 'Aurora ICU CI')
            $rules = @(Register-AuroraFirewallRule -Port 48620 -DisplayName 'Aurora ICU CI')
          } catch { Write-Host "FAIL - $($_.Exception.Message)"; exit 1 }
          if ($rules.Count -ne 1) { Write-Host "FAIL - $($rules.Count) rule(s) after TWO registrations; create-before-remove must converge on exactly one"; exit 1 }
          Write-Host 'ok   firewall rule exists, and TWO registrations converge on exactly ONE rule (never ruleless, never duplicated)'
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
          Remove-NetFirewallRule -DisplayName 'Aurora ICU CI'
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) { Write-Host 'FAIL - cleanup left the task behind'; exit 1 }
          if (@(Get-NetFirewallRule -DisplayName 'Aurora ICU CI' -ErrorAction SilentlyContinue).Count -ne 0) { Write-Host 'FAIL - cleanup left the rule behind'; exit 1 }
          Write-Host 'ok   cleanup verified - the probes saw BOTH states, so a vacuous probe cannot pass'
      - name: Release version-gate tests + the committed ledger, ON 5.1
        run: .\installer\test-version-gate.ps1

      # The SHIP gate (environment-separation PR-4): what Aurora ships must
      # be what Aurora verified. Pure fixture tests cover every refusal
      # class (source/ci/staging/suite evidence, fail-closed on unavailable
      # verification), the AST pins that make build-protected.ps1's
      # chokepoint structural (gate before the password prompt, pinned
      # parameter list, no skip switch in any spelling), and the sync
      # between scripts/ship-requirements.json and the repository (suite
      # inventory on disk, ci.yml job names, the print suite's ctx list,
      # promotion-gate.sh reading the shared truth). No network.
      - name: Ship-gate pure tests + chokepoint pins + shared-truth sync, ON 5.1
        run: .\installer\test-ship-gate.ps1

      # The gate is only worth having if it can actually stop a build. Prove
      # that here by running build-protected.ps1's own refusal path against a
      # version that IS already in the committed ledger, and asserting the
      # script exits non-zero WITHOUT compiling anything.
      - name: Prove the gate stops a real build (build-protected.ps1 refuses an already-shipped version)
        run: |
          . .\installer\version-gate.ps1
          $entries = Read-ShippedLedger -Lines (Get-Content .\installer\SHIPPED_VERSIONS.txt)
          $shipped = Get-NewestShippedVersion -Entries $entries -Kind 'setup'
          if (-not $shipped) {
            Write-Host "no setup release recorded yet - nothing to prove the gate against"
            exit 0
          }
          # -PgZip points at a path that does not exist on purpose: if the gate
          # runs BEFORE staging (as it must), we never get far enough to care.
          $iss = '.\installer\aurora.iss'
          $orig = Get-Content -Raw $iss
          try {
            (Get-Content -Raw $iss) -replace '(#define\s+AppVer\s+")[^"]+(")', "`${1}$shipped`${2}" |
              Set-Content -NoNewline -Encoding ascii $iss
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\build-protected.ps1 `
                     -PgZip C:\does-not-exist.zip -SkipStage 2>&1 | Out-String
            $rc = $LASTEXITCODE
          } finally {
            Set-Content -NoNewline -Encoding ascii -Path $iss -Value $orig
          }
          Write-Host $out
          if ($rc -eq 0) { Write-Host "FAIL - build-protected.ps1 did NOT refuse an already-shipped version"; exit 1 }
          if ($out -notmatch 'REFUSED - VERSION GATE') { Write-Host "FAIL - it exited $rc but not via the version gate"; exit 1 }
          if ($out -notmatch 'HAS ALREADY SHIPPED') { Write-Host "FAIL - the refusal did not name the already-shipped version"; exit 1 }
          if ($out -match 'Company install password') { Write-Host "FAIL - it reached the password prompt; the gate must refuse BEFORE that"; exit 1 }
          Write-Host "confirmed: build-protected.ps1 refused $shipped before prompting or compiling (exit $rc)"
          # The child process exited 1 ON PURPOSE - that is the assertion. Without
          # this the shell wrapper inherits $LASTEXITCODE and marks the step failed
          # for proving exactly what it was asked to prove.
          exit 0

      # ...and the SHIP gate must stop a real build too (PR-4). Bump AppVer
      # PAST the ledger so the VERSION gate passes and any refusal can only
      # be the ship gate's; the bump itself dirties the tree, which is the
      # deterministic, OFFLINE refusal (SOURCE-DIRTY-TREE: an artifact built
      # from a dirty tree matches no commit, so no evidence can vouch for
      # it). This proves, on the real shipping engine, that build-protected
      # cannot compile unverified content, that the refusal is
      # message-discriminated, that it fires BEFORE the password prompt, and
      # that the offline check really short-circuits (no network stage runs).
      - name: Prove the SHIP gate stops a real build (build-protected.ps1 refuses unverified content)
        run: |
          $iss = '.\installer\aurora.iss'
          $orig = Get-Content -Raw $iss
          try {
            (Get-Content -Raw $iss) -replace '(#define\s+AppVer\s+")[^"]+(")', '${1}99.99.99${2}' |
              Set-Content -NoNewline -Encoding ascii $iss
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\build-protected.ps1 `
                     -PgZip C:\does-not-exist.zip -SkipStage 2>&1 | Out-String
            $rc = $LASTEXITCODE
          } finally {
            Set-Content -NoNewline -Encoding ascii -Path $iss -Value $orig
          }
          Write-Host $out
          if ($rc -eq 0) { Write-Host "FAIL - build-protected.ps1 did NOT refuse a dirty (unverifiable) tree"; exit 1 }
          if ($out -match 'REFUSED - VERSION GATE') { Write-Host "FAIL - the VERSION gate refused 99.99.99, so the ship gate was never even reached"; exit 1 }
          if ($out -notmatch 'REFUSED - SHIP GATE') { Write-Host "FAIL - it exited $rc but not via the ship gate"; exit 1 }
          if ($out -notmatch 'SOURCE-DIRTY-TREE') { Write-Host "FAIL - the refusal is not message-discriminated as SOURCE-DIRTY-TREE"; exit 1 }
          if ($out -match 'Company install password') { Write-Host "FAIL - it reached the password prompt; the ship gate must refuse BEFORE any secret is requested"; exit 1 }
          if ($out -match 'ci evidence: querying') { Write-Host "FAIL - the offline source check did not short-circuit; the gate went to the network with a dirty tree"; exit 1 }
          Write-Host "confirmed: build-protected.ps1 refused unverified content [SOURCE-DIRTY-TREE] before prompting, compiling, or touching the network (exit $rc)"
          exit 0

      # aurora.iss must be pure ASCII (the Inno compiler and the 5.1 engine
      # both read it as such), and so must the ledger the gate parses.
      - name: aurora.iss and the ledger must restore byte-for-byte after the gate proof
        run: |
          $dirty = & git status --porcelain installer
          if ($dirty) {
            Write-Host "FAIL - the gate proof left installer\ modified:"
            $dirty | ForEach-Object { Write-Host "  $_" }
            & git diff -- installer | Write-Host
            exit 1
          }
          Write-Host "confirmed: installer\ is byte-for-byte unchanged"
          exit 0

      # ------------------------------------------------------------------
      # RUNTIME gate. Everything above only PARSES the scripts. That is not
      # enough: [IO.Path]::GetRelativePath parses perfectly on 5.1 and then
      # throws MethodNotFound when the line executes, because it is .NET Core
      # 2.1+ only and 5.1 runs on .NET Framework. It shipped, and it broke the
      # update-package build outright at step 3u on a real build box
      # (2026-08-05) - the same 5.1 class as the #184 ternary, one layer down.
      # A parse gate cannot see that. Only running the thing can.
      #
      # So: run the REAL update-package staging under 5.1 - npm ci, vite build,
      # dotnet publish, version.json, SHA256SUMS - with no test-only branch in
      # build.ps1. -SkipCompile stops it before ISCC, which needs Inno Setup and
      # the company password.
      #
      # HONEST BOUNDARY, stated rather than implied: this covers build.ps1's
      # UPDATE path end-to-end. It does NOT cover the full-installer steps 3-5
      # (Postgres/model/llama staging), which need multi-GB inputs CI has no
      # copy of, nor the ISCC compile. Those remain unexercised here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: The update-package staging must RUN on 5.1 (not just parse)
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion) / CLR $([System.Environment]::Version)"
          .\installer\build.ps1 -UpdateOnly -SkipCompile
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      # A staging run that produced a malformed SHA256SUMS would still "pass"
      # the step above. Replay aurora-update.ps1's OWN verification loop against
      # what was just written - same regex, same Join-Path resolution, same hash
      # comparison. If this passes, the package would verify on a hospital server.
      - name: The SHA256SUMS must verify exactly as aurora-update.ps1 verifies it
        run: |
          $pkg   = '.\installer\payload'
          $sums  = Join-Path $pkg 'SHA256SUMS'
          if (-not (Test-Path $sums)) { Write-Host "FAIL - no SHA256SUMS was written"; exit 1 }
          $lines = @(Get-Content $sums)
          if ($lines.Count -lt 10) { Write-Host "FAIL - SHA256SUMS has only $($lines.Count) line(s); the payload cannot be that small"; exit 1 }
          # the exact regex from aurora-update.ps1
          $bad = @(); $checked = 0
          foreach ($line in $lines) {
            if ($line -notmatch '^\s*([0-9a-fA-F]{64})\s+(.+?)\s*$') { $bad += "unparseable: $line"; continue }
            $want = $Matches[1].ToLowerInvariant(); $rel = $Matches[2]
            if ($rel -notlike 'server\*') { $bad += "not package-relative: '$rel' (expected 'server\...' - a GetRelativePath-style regression)"; continue }
            if ($rel -match '[A-Za-z]:\\') { $bad += "ABSOLUTE path leaked into the package: '$rel'"; continue }
            $path = Join-Path $pkg $rel
            if (-not (Test-Path $path)) { $bad += "$rel (missing)"; continue }
            $have = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLowerInvariant()
            if ($have -ne $want) { $bad += "$rel (checksum mismatch)" }
            $checked++
          }
          # ...and every file on disk must be COVERED, or the updater would
          # happily verify a package with an unlisted file swapped in.
          $onDisk = @(Get-ChildItem -Recurse -File (Join-Path $pkg 'server')).Count
          if ($checked -ne $onDisk) { $bad += "SHA256SUMS covers $checked file(s) but payload\server holds $onDisk" }
          if ($bad.Count -gt 0) {
            Write-Host "FAIL - the staged package would NOT verify on a hospital server:"
            $bad | Select-Object -First 15 | ForEach-Object { Write-Host "    $_" }
            exit 1
          }
          Write-Host "confirmed: $checked file(s) listed, all present, all hashes match, all paths package-relative"
          Write-Host ("sample: " + $lines[0])
          exit 0

      - name: version.json must be well-formed and stamped from aurora.iss
        run: |
          $v = Get-Content -Raw '.\installer\payload\server\version.json' | ConvertFrom-Json
          $iss = ([regex]::Match((Get-Content -Raw '.\installer\aurora.iss'), '#define\s+AppVer\s+"([^"]+)"').Groups[1].Value)
          $fail = 0
          if ($v.version -ne $iss) { Write-Host "FAIL - version.json says $($v.version), aurora.iss says $iss"; $fail = 1 }
          if ($v.environment -ne 'production') { Write-Host "FAIL - environment is '$($v.environment)', not production; aurora-update would refuse it"; $fail = 1 }
          if (-not $v.migrationHead) { Write-Host "FAIL - no migrationHead"; $fail = 1 }
          if (-not $v.requiredEnvKeys -or $v.requiredEnvKeys.Count -lt 5) { Write-Host "FAIL - requiredEnvKeys missing or suspiciously short"; $fail = 1 }
          if ($fail) { exit 1 }
          Write-Host "confirmed: $($v.version) / migrationHead $($v.migrationHead) / $($v.requiredEnvKeys.Count) required env keys / environment $($v.environment)"
          exit 0

      # TWO facts about the PUBLISHED assembly, both load-bearing, asserted on the
      # real Windows publish because neither can be checked by reading source.
      #
      #  1. FileVersion must be the release version. Until 2026-08-06 nothing set
      #     a version at all, so every build of every release stamped 1.0.0.0 and
      #     an owner who checked the running exe after a successful 1.2.0 update
      #     saw "1.0.0" and concluded the update had not applied.
      #  2. ProductVersion (= InformationalVersion) must STILL carry "+<sha>".
      #     Program.cs ResolveRunningBuild parses everything after the '+' and
      #     /healthz reports it; aurora-update.ps1 polls until that equals the
      #     package commit. Adding -p:Version could have displaced the suffix -
      #     if it ever does, EVERY update fails its health check and rolls back,
      #     which is precisely the class of defect this repo keeps finding only
      #     in the field. So it is proven here, not reasoned about.
      - name: The published assembly carries the release version AND the commit suffix
        run: |
          $dll = '.\installer\payload\server\AuroraIcu.Api.dll'
          if (-not (Test-Path $dll)) { Write-Host "FAIL - no published assembly at $dll"; exit 1 }
          $iss = ([regex]::Match((Get-Content -Raw '.\installer\aurora.iss'), '#define\s+AppVer\s+"([^"]+)"').Groups[1].Value)
          $sha = (& git rev-parse HEAD).Trim()
          $fi  = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll))
          Write-Host "FileVersion    = $($fi.FileVersion)"
          Write-Host "ProductVersion = $($fi.ProductVersion)"
          $fail = 0
          # FileVersion is always 4-part; AppVer is 3-part (plus an optional tag).
          $core = ($iss -split '-', 2)[0]
          if ($fi.FileVersion -notlike "$core*") {
            Write-Host "FAIL - FileVersion '$($fi.FileVersion)' does not carry aurora.iss AppVer '$iss'"; $fail = 1
          }
          if ($fi.ProductVersion -notlike "*+$sha") {
            Write-Host "FAIL - ProductVersion '$($fi.ProductVersion)' does not end '+$sha'. /healthz would stop reporting the commit and EVERY update would fail its health check and roll back."; $fail = 1
          }
          if ($fail) { exit 1 }
          Write-Host "confirmed: the published assembly reports version $iss and commit $sha"
          exit 0

      # NEGATIVE CONTROL - because the step above CANNOT FAIL on main, and a
      # check that cannot fail is worth nothing.
      #
      # main's aurora.iss AppVer is 1.0.0, and 1.0.0.0 is ALSO what the .NET SDK
      # stamps when no version is passed at all. So "FileVersion starts 1.0.0"
      # holds identically whether -p:Version is plumbed through or was silently
      # dropped. The first run of that assertion (2026-08-09, PR #194) printed
      # FileVersion = 1.0.0.0 and passed, proving nothing about the flag.
      #
      # This step builds the SAME project with a version that is NOT the SDK
      # default and requires the assembly to carry it, which fails loudly if
      # -p:Version stops being honoured. It also re-checks that SourceRevisionId
      # still appends "+<sha>" ALONGSIDE an explicit Version - the coexistence
      # that actually matters, since losing that suffix makes every update fail
      # its health check and roll back.
      - name: -p:Version is really plumbed through (negative control, non-default version)
        run: |
          $sha = (& git rev-parse HEAD).Trim()
          $out = Join-Path $env:RUNNER_TEMP 'verstamp-control'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          & dotnet build '.\server\AuroraIcu.Api.csproj' -c Release --nologo `
              -p:Version=9.9.9 "-p:SourceRevisionId=$sha" -o $out 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL - the control build did not compile (exit $LASTEXITCODE); the stamp cannot be verified"; exit 1 }
          $dll = Join-Path $out 'AuroraIcu.Api.dll'
          if (-not (Test-Path $dll)) { Write-Host "FAIL - no control assembly at $dll"; exit 1 }
          $fi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
          Write-Host "control FileVersion    = $($fi.FileVersion)"
          Write-Host "control ProductVersion = $($fi.ProductVersion)"
          $fail = 0
          if ($fi.FileVersion -notlike '9.9.9*') {
            Write-Host "FAIL - asked for Version=9.9.9 and got FileVersion '$($fi.FileVersion)'. -p:Version is NOT reaching the compiler, so build.ps1 stamps nothing and every release reports the SDK default."; $fail = 1
          }
          if ($fi.ProductVersion -notlike "*+$sha") {
            Write-Host "FAIL - control ProductVersion '$($fi.ProductVersion)' does not end '+$sha'. An explicit Version has displaced the commit suffix: /healthz would stop reporting the commit and EVERY update would fail its health check and roll back."; $fail = 1
          }
          if ($fail) { exit 1 }
          Write-Host "confirmed: an explicit -p:Version reaches the assembly AND coexists with the +<sha> suffix"
          exit 0

      # And that build.ps1 still PASSES it. The control above proves the SDK
      # honours the flag; this proves the shipping build still supplies it.
      - name: build.ps1 must pass -p:Version to the publish
        run: |
          $b = Get-Content -Raw '.\installer\build.ps1'
          if ($b -notmatch '-p:Version=\$appVer') {
            Write-Host "FAIL - installer\build.ps1 no longer passes -p:Version=`$appVer; the shipped exe would report the SDK default 1.0.0.0 at every release."
            exit 1
          }
          Write-Host 'confirmed: build.ps1 stamps the release version into the assembly'
          exit 0
